<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* marca = verde floresta; entradas = azul (--pos); saídas = vermelho (--neg); sucesso = verde (--ok) */
  --bg:#F5F4EF; --surface:#FFFFFF; --surface-2:#F3F5F1; --ink:#1E2A24; --ink-2:#4B5A52; --ink-3:#7F8C84;
  --line:#E6E8E2; --line-2:#D5DAD2; --brand:#2F6B4F; --brand-2:#4E8F6C; --brand-ink:#FFFFFF; --brand-soft:#E4EFE7; --brand-band:#EAF2EB;
  --pos:#2F6DB5; --pos-2:#9CBCE3; --pos-soft:#E5EEF8; --neg:#C8453C; --neg-2:#E9A8A1; --neg-soft:#FBE9E6;
  --ok:#2E8B57; --ok-soft:#E0F2E7; --warn:#B7741A; --warn-soft:#FBF0DD; --info:#2F6B4F; --info-soft:#E4EFE7;
  --sage:#A9C4B0; --sage-2:#CFDDD2; --sand:#E2D2BC; --terra:#D9A38F;
  --shadow:0 1px 2px rgba(30,42,36,.04),0 10px 30px -14px rgba(30,42,36,.12);
  --r:14px; --head:'Manrope',system-ui,sans-serif; --sans:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#18201B; --surface-2:#1E2822; --ink:#E9EFEA; --ink-2:#B4C2B8; --ink-3:#7F8F85;
  --line:#26312A; --line-2:#334037; --brand:#6DB58C; --brand-2:#8FCBA8; --brand-ink:#0F1A13; --brand-soft:#1F3328; --brand-band:#1D2C23;
  --pos:#6FA6E6; --pos-2:#34557D; --pos-soft:#18263A; --neg:#EF7B70; --neg-2:#7A3A35; --neg-soft:#3A1D1A;
  --ok:#5CC98B; --ok-soft:#173226; --warn:#E3A64B; --warn-soft:#352914; --info:#6DB58C; --info-soft:#1F3328;
  --sage:#4E7A5E; --sage-2:#2E4637; --sand:#5A4E3E; --terra:#8A5A4A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#18201B; --surface-2:#1E2822; --ink:#E9EFEA; --ink-2:#B4C2B8; --ink-3:#7F8F85;
  --line:#26312A; --line-2:#334037; --brand:#6DB58C; --brand-2:#8FCBA8; --brand-ink:#0F1A13; --brand-soft:#1F3328; --brand-band:#1D2C23;
  --pos:#6FA6E6; --pos-2:#34557D; --pos-soft:#18263A; --neg:#EF7B70; --neg-2:#7A3A35; --neg-soft:#3A1D1A;
  --ok:#5CC98B; --ok-soft:#173226; --warn:#E3A64B; --warn-soft:#352914; --info:#6DB58C; --info-soft:#1F3328;
  --sage:#4E7A5E; --sage-2:#2E4637; --sand:#5A4E3E; --terra:#8A5A4A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
h1,h2,h3{font-family:var(--head);font-weight:800;letter-spacing:-.01em;margin:0}
h1{font-size:28px;line-height:1.15} h2{font-size:17px;font-weight:700} h3{font-size:15px;font-weight:700}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--ink-3)} .small{font-size:12px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .ok{color:var(--ok)}
.app{display:grid;grid-template-columns:auto 1fr;min-height:100vh}
.side{width:240px;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px;transition:width .2s}
.app.mini .side{width:72px} .app.mini .side .lbl,.app.mini .nav-sec,.app.mini .brand-txt,.app.mini .who,.app.mini .badge{display:none}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 22px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;stroke:var(--brand-ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand-txt small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.brand-txt b{font-family:var(--head);font-weight:800;font-size:17px}
.nav-sec{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:16px 12px 6px}
.nav a{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--surface-2);color:var(--ink)} .nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{margin-left:auto;background:var(--neg-soft);color:var(--neg);border-radius:99px;font-size:11px;padding:0 8px;font-weight:700}
.side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:99px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}
.who b{display:block;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.top{display:flex;align-items:center;gap:10px;padding:12px 32px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:30}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.main{padding:26px 32px 60px;min-width:0;max-width:1400px;width:100%;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head p{margin:6px 0 0;color:var(--ink-3)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:700;margin-bottom:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card.pad{padding:18px 20px}
.band{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--brand-band);padding:10px 20px;border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
.band h2{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);font-weight:800;font-family:var(--sans)}
.band .muted{font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:18px 20px}
.kpi .l{font-size:11.5px;color:var(--ink-3);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.kpi .v{font-family:var(--head);font-weight:800;font-size:clamp(20px,2vw,28px);letter-spacing:-.02em;margin:8px 0 6px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v small{font-size:.52em;color:var(--ink-3);margin-left:3px;font-weight:600}
.kpi .s{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kpi.hl{background:var(--brand);border-color:var(--brand)} .kpi.hl .l,.kpi.hl .s,.kpi.hl .v small{color:color-mix(in srgb,var(--brand-ink) 78%,transparent)} .kpi.hl .v{color:var(--brand-ink)}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.delta.up{background:var(--ok-soft);color:var(--ok)} .delta.down{background:var(--neg-soft);color:var(--neg)}
.kpi.hl .delta{background:color-mix(in srgb,var(--brand-ink) 18%,transparent);color:var(--brand-ink)}
.grid2{display:grid;grid-template-columns:1.65fr 1fr;gap:14px;margin-bottom:14px}
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:13px;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)} .btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--neg)} .btn.ok{color:var(--ok);border-color:var(--ok-soft)}
.btn.sm{padding:3px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;color:var(--brand);cursor:pointer;padding:0;text-decoration:underline}
input,select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:7px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:3px solid var(--brand-soft);border-color:var(--brand)}
textarea{min-height:70px;resize:vertical;width:100%}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-2);margin-bottom:16px;overflow-x:auto;overflow-y:hidden}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink-3);border-bottom:2.5px solid transparent;white-space:nowrap;font-weight:600;margin-bottom:-1px}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:var(--surface-2)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
tfoot td{font-weight:800;border-top:2px solid var(--brand);background:var(--brand-band)}
.tb th{background:var(--brand);color:var(--brand-ink);border:0}
.tb tbody tr:nth-child(even) td{background:var(--surface-2)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.p-previsto{background:var(--surface-2);color:var(--ink-2)} .p-aprovado{background:var(--pos-soft);color:var(--pos)}
.p-pago,.p-paga{background:var(--ok-soft);color:var(--ok)} .p-atrasado,.p-rejeitada{background:var(--neg-soft);color:var(--neg)}
.p-cancelado{background:var(--surface-2);color:var(--ink-3);text-decoration:line-through}
.p-enviada{background:var(--warn-soft);color:var(--warn)} .p-aprovada{background:var(--brand-soft);color:var(--brand)}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.empty{padding:36px;text-align:center;color:var(--ink-3)}
.modal-bg{position:fixed;inset:0;background:rgba(17,22,19,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:16px;width:min(640px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.modal header{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:var(--brand-band)}
.modal .body{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.modal footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.f{display:flex;flex-direction:column;gap:4px} .f.full{grid-column:1/-1}
.f label{font-size:12px;color:var(--ink-2);font-weight:600} .f .hint{font-size:11px;color:var(--ink-3)}
.f input,.f select{width:100%}
.chk{flex-direction:row;align-items:center;gap:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;box-shadow:var(--shadow);max-width:90vw}
.toast.err{background:var(--neg);color:#fff}
.bar,.mbar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar > i,.mbar > i{display:block;height:100%;background:var(--brand);border-radius:99px} .bar > i.over{background:var(--neg)}
.list-item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.note{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px}
.note.info{background:var(--info-soft)} .note.neg{background:var(--neg-soft)}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth .card{width:min(400px,100%);padding:30px}
.auth form{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.auth input{width:100%}
.steps{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.steps span.on{color:var(--ink);font-weight:600}
.dre td:first-child{white-space:nowrap} .dre tr.grp td{background:var(--brand-band);font-weight:700}
.dre tr.tot td{font-weight:800;border-top:2px solid var(--brand);background:var(--brand-band)}
.chart svg{width:100%;height:auto;display:block}
.chart-wrap{padding:14px 16px 12px} .chart-wrap svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.donut-wrap{display:flex;align-items:center;gap:20px;padding:18px 20px 20px;flex-wrap:wrap;justify-content:center}
.donut{width:140px;height:140px;flex:none}
.lg{flex:1 1 220px;display:grid;gap:9px;font-size:13px;min-width:0}
.lg div{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:10px;align-items:center}
.lg div > span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg i{width:10px;height:10px;border-radius:3px}
.lg .p{color:var(--ink-3);font-size:12px;width:40px;text-align:right}
.lg .tot{border-top:1px solid var(--line);padding-top:9px;font-weight:700}
.destaques ul{margin:8px 0 0;padding-left:18px;color:var(--ink-2);display:grid;gap:5px}
.portal{max-width:880px;margin:0 auto;padding:28px 16px 60px}
.nf-item{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.nf-item:last-child{border-bottom:0}
.menu-btn{display:none}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none} .app.mini .side{width:260px}
  .menu-btn{display:grid} .mini-btn{display:none}
  .main{padding:18px 16px 60px} .top{padding:10px 16px}
  .modal .body{grid-template-columns:1fr}
  .donut-wrap{flex-direction:column;align-items:stretch} .donut{margin:0 auto}
  h1{font-size:23px}
}
</style>

<body>
<div id="root"></div>
<script src="/config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { semAcento, parseNum, parseData, parseCSV, PULAR, tabelaParaExtrato, chavesExtrato } from './js/extrato-parser.js';

// ============================================================================
// CONFIGURAÇÃO — vem de /config.js, gerado no build a partir das variáveis de
// ambiente SUPABASE_URL e SUPABASE_ANON_KEY (scripts/gerar-config.mjs).
// A anon key é pública por natureza: quem protege os dados é o RLS.
// Sem config.js (rodando local sem build), a tela pede os dados.
// ============================================================================
const CONFIG = window.__FIN_CONFIG || { url: '', anonKey: '' };

// ----------------------------------------------------------------------------
// utilidades
// ----------------------------------------------------------------------------
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} },
};
class Raw { constructor(s){ this.s = s; } }
const raw = s => new Raw(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = v => v instanceof Raw ? v.s : Array.isArray(v) ? v.map(val).join('') : (v == null || v === false) ? '' : esc(v);
// html`...` escapa tudo que é interpolado. Texto digitado por PJs externos
// (descrição da NF, nome do arquivo) nunca vira HTML executável aqui dentro.
function html(strings, ...vals){ let o = ''; strings.forEach((s,i) => { o += s; if (i < vals.length) o += val(vals[i]); }); return raw(o); }
const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => [...el.querySelectorAll(sel)];

const BRL = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' });
const money = v => v == null || v === '' ? '—' : BRL.format(Number(v));
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const monthKey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const addMonths = (ym, n) => { const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return monthKey(d); };
const firstDay = ym => `${ym}-01`;
const lastDay = ym => { const [y,m] = ym.split('-').map(Number); return iso(new Date(y, m, 0)); };
const brDate = s => s ? s.slice(0,10).split('-').reverse().join('/') : '—';
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const brMonth = s => { if(!s) return '—'; const [y,m] = s.slice(0,7).split('-'); return `${MESES[+m-1]}/${y.slice(2)}`; };
const parseMoney = s => { if (s == null) return null; s = String(s).trim().replace(/[R$\s]/g,''); if (!s) return null; if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); const n = Number(s); return isNaN(n) ? NaN : n; };
const moneyInput = v => v == null || v === '' ? '' : Number(v).toFixed(2).replace('.',',');

function toast(msg, err=false){
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 3000);
}
function errMsg(e){
  const m = e?.message || String(e);
  if (/duplicate key.*nf_numero_uk/.test(m)) return 'Já existe uma nota com esse número para este fornecedor.';
  if (/duplicate key.*fornecedores_email_uk/.test(m)) return 'Esse e-mail já está em outro cadastro.';
  if (/duplicate key/.test(m)) return 'Já existe um registro com esses dados.';
  if (/row-level security/.test(m)) return 'Seu perfil não tem permissão para isso.';
  if (/Invalid login credentials/.test(m)) return 'E-mail ou senha incorretos.';
  if (/Email not confirmed/.test(m)) return 'Confirme seu e-mail pelo link que enviamos antes de entrar.';
  return m;
}
async function q(promise){ const { data, error, count } = await promise; if (error) throw error; return count != null ? { data, count } : data; }

// ----------------------------------------------------------------------------
// conexão
// ----------------------------------------------------------------------------
const cfg = CONFIG.url ? CONFIG : store.get('fin_cfg');
const root = $('#root');

function renderConfig(){
  root.innerHTML = html`<div class="auth"><div class="card">
    <h1>Conectar ao Supabase</h1>
    <p class="muted">Cole a URL e a anon key do projeto (Project Settings → API). Para publicar para a equipe e PJs, preencha a constante CONFIG no topo do arquivo em vez de usar esta tela.</p>
    <form id="cf"><input name="url" placeholder="https://xxxx.supabase.co" required>
    <input name="key" placeholder="anon key (eyJ...)" required>
    <button class="btn pri">Salvar e continuar</button></form></div></div>`.s;
  $('#cf').onsubmit = e => { e.preventDefault(); const f = new FormData(e.target);
    store.set('fin_cfg', { url: f.get('url').trim(), anonKey: f.get('key').trim() }); location.reload(); };
}

let sb;

function renderAuth(modo){
  const titulos = { entrar:'Entrar', criar:'Criar acesso', esqueci:'Recuperar senha', 'nova-senha':'Definir nova senha' };
  root.innerHTML = html`<div class="auth"><div class="card">
    <div class="small muted" style="letter-spacing:.06em;text-transform:uppercase">Financeiro</div>
    <h1>${titulos[modo]}</h1>
    ${modo === 'criar' ? html`<p class="muted small">Prestador PJ: use o mesmo e-mail que você passou para o financeiro — é ele que libera o envio das suas notas.</p>` : ''}
    <form id="af">
      ${modo === 'criar' ? html`<input name="nome" placeholder="Seu nome" required autocomplete="name">` : ''}
      ${modo !== 'nova-senha' ? html`<input name="email" type="email" placeholder="E-mail" required autocomplete="email">` : ''}
      ${modo !== 'esqueci' ? html`<input name="senha" type="password" placeholder="${modo === 'entrar' ? 'Senha' : 'Senha (mín. 8 caracteres)'}" required minlength="${modo === 'entrar' ? 1 : 8}" autocomplete="${modo === 'entrar' ? 'current-password' : 'new-password'}">` : ''}
      <button class="btn pri" type="submit">${titulos[modo]}</button>
    </form>
    <div class="row small" style="margin-top:14px;justify-content:space-between">
      ${modo === 'entrar' ? html`<button class="linkbtn" data-m="criar">Criar acesso</button><button class="linkbtn" data-m="esqueci">Esqueci a senha</button>` : html`<button class="linkbtn" data-m="entrar">Voltar para o login</button>`}
    </div></div></div>`.s;
  $$('[data-m]').forEach(b => b.onclick = () => renderAuth(b.dataset.m));
  $('#af').onsubmit = async e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); const btn = $('button[type=submit]', e.target); btn.disabled = true;
    try {
      if (modo === 'entrar') { const { data, error } = await sb.auth.signInWithPassword({ email:f.email, password:f.senha }); if (error) throw error; await afterLogin(data.session); }
      if (modo === 'criar') {
        const { data, error } = await sb.auth.signUp({ email:f.email, password:f.senha, options:{ data:{ nome:f.nome }, emailRedirectTo: location.origin + location.pathname } });
        if (error) throw error;
        if (data.session) await afterLogin(data.session);
        else { toast('Enviamos um link de confirmação para o seu e-mail.'); renderAuth('entrar'); }
      }
      if (modo === 'esqueci') { const { error } = await sb.auth.resetPasswordForEmail(f.email, { redirectTo: location.origin + location.pathname }); if (error) throw error; toast('Se o e-mail existir, você vai receber um link para redefinir a senha.'); renderAuth('entrar'); }
      if (modo === 'nova-senha') { const { data, error } = await sb.auth.updateUser({ password:f.senha }); if (error) throw error; history.replaceState(null,'',location.pathname); toast('Senha atualizada.'); const s = await sb.auth.getSession(); await afterLogin(s.data.session); }
    } catch(err) { toast(errMsg(err), true); btn.disabled = false; }
  };
}

// ----------------------------------------------------------------------------
// modal de formulário genérico
// field: {key,label,type,options,required,full,hint,onChange,min,accept}
// ----------------------------------------------------------------------------
function formModal({ title, fields, initial={}, saveLabel='Salvar', onSave, note }){
  return new Promise(resolve => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    const fieldHtml = f => {
      const v = initial[f.key];
      const req = f.required ? raw(' required') : '';
      const id = 'f_' + f.key;
      let input;
      switch (f.type) {
        case 'select': input = html`<select id="${id}" name="${f.key}"${req}><option value="">${f.placeholder || '—'}</option>${(typeof f.options === 'function' ? f.options(initial) : f.options).map(o => html`<option value="${o.value}"${String(o.value) === String(v ?? '') ? raw(' selected') : ''}>${o.label}</option>`)}</select>`; break;
        case 'textarea': input = html`<textarea id="${id}" name="${f.key}"${req}>${v ?? ''}</textarea>`; break;
        case 'bool': input = html`<input id="${id}" type="checkbox" name="${f.key}"${v ? raw(' checked') : ''}>`; break;
        case 'money': input = html`<input id="${id}" name="${f.key}" inputmode="decimal" placeholder="0,00" value="${moneyInput(v)}"${req}>`; break;
        case 'month': input = html`<input id="${id}" type="month" name="${f.key}" value="${v ? String(v).slice(0,7) : ''}"${req}>`; break;
        case 'tags': input = html`<input id="${id}" name="${f.key}" value="${(v || []).join(', ')}" placeholder="PE - Master Fluxo, VE - 1/26">`; break;
        case 'file': input = html`<input id="${id}" type="file" name="${f.key}" accept="${f.accept || ''}"${req}>`; break;
        default: input = html`<input id="${id}" type="${f.type || 'text'}" name="${f.key}" value="${v ?? ''}"${f.min != null ? raw(` min="${f.min}"`) : ''}${f.max != null ? raw(` max="${f.max}"`) : ''}${req}>`;
      }
      return html`<div class="f${f.full || f.type === 'textarea' ? raw(' full') : ''}${f.type === 'bool' ? raw(' chk') : ''}">${f.type === 'bool' ? html`${input}<label for="${id}">${f.label}</label>` : html`<label for="${id}">${f.label}${f.required ? ' *' : ''}</label>${input}`}${f.hint ? html`<span class="hint">${f.hint}</span>` : ''}</div>`;
    };
    bg.innerHTML = html`<form class="modal" novalidate><header><h2>${title}</h2><button type="button" class="btn sm" data-x>Fechar</button></header>
      <div class="body">${note ? html`<div class="f full note info">${note}</div>` : ''}${fields.map(fieldHtml)}</div>
      <footer><button type="button" class="btn" data-x>Cancelar</button><button class="btn pri" type="submit">${saveLabel}</button></footer></form>`.s;
    document.body.appendChild(bg);
    const form = $('form', bg);
    const close = r => { bg.remove(); resolve(r); };
    $$('[data-x]', bg).forEach(b => b.onclick = () => close(null));
    bg.addEventListener('mousedown', e => { if (e.target === bg) close(null); });
    const read = () => {
      const out = {};
      for (const f of fields) {
        const elx = form.elements[f.key]; if (!elx) continue;
        let v = elx.value;
        if (f.type === 'bool') v = elx.checked;
        else if (f.type === 'money') v = parseMoney(v);
        else if (f.type === 'number') v = v === '' ? null : Number(v);
        else if (f.type === 'month') v = v ? v + '-01' : null;
        else if (f.type === 'tags') v = v.split(',').map(s => s.trim()).filter(Boolean);
        else if (f.type === 'file') v = elx.files[0] || null;
        else v = v === '' ? null : v;
        out[f.key] = v;
      }
      return out;
    };
    fields.filter(f => f.onChange).forEach(f => form.elements[f.key].addEventListener('change', () => f.onChange(read(), form)));
    form.onsubmit = async e => {
      e.preventDefault();
      const data = read();
      for (const f of fields) {
        const v = data[f.key];
        if (f.required && (v == null || v === '' || (Array.isArray(v) && !v.length))) return toast(`Preencha: ${f.label}`, true);
        if (f.type === 'money' && Number.isNaN(v)) return toast(`Valor inválido em: ${f.label}`, true);
      }
      const btn = $('button[type=submit]', form); btn.disabled = true;
      try { const r = onSave ? await onSave(data) : data; close(r ?? true); }
      catch(err) { toast(errMsg(err), true); btn.disabled = false; }
    };
    setTimeout(() => form.querySelector('input:not([type=checkbox]),select,textarea')?.focus(), 30);
  });
}

async function portalLista(){

      <div class="row">

        ${n.status === 'enviada' ? html`<button class="btn sm danger" data-del="${n.id}">Excluir</button>` : ''}
      </div></div>`)}`.s;
  $$('[data-ver]', box).forEach(b => b.onclick = () => abrirArquivo(rows.find(r => r.id === b.dataset.ver).arquivo_path));
  $$('[data-edit]', box).forEach(b => b.onclick = () => nfForm(rows.find(r => r.id === b.dataset.edit)));
  $$('[data-del]', box).forEach(b => b.onclick = async () => {
    const n = rows.find(r => r.id === b.dataset.del);
    if (!await confirmar('Excluir nota', `Excluir a NF ${n.numero}? Você pode enviar de novo depois.`, 'Excluir')) return;
    try { await q(sb.from('notas_fiscais').delete().eq('id', n.id)); await sb.storage.from('notas-fiscais').remove([n.arquivo_path]); toast('Nota excluída.'); portalLista(); } catch(e) { toast(errMsg(e), true); }
  });

function statusTexto(n){
  if (n.status === 'enviada') return 'Recebida, aguardando conferência do financeiro';
  if (n.status === 'aprovada') return n.data_prevista_pagamento ? `Aprovada · pagamento previsto para ${brDate(n.data_prevista_pagamento)}` : 'Aprovada';
  if (n.status === 'paga') return `Paga em ${brDate(n.data_pagamento)}`;
  if (n.status === 'rejeitada') return 'Precisa de correção';
  return '';
}

async function abrirArquivo(path, bucket='notas-fiscais'){
  const w = window.open('', '_blank');
  const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, 300);
  if (error) { w?.close(); return toast(errMsg(error), true); }
  if (w) w.location = data.signedUrl; else location.href = data.signedUrl;
}

const ACEITOS = '.pdf,.xml,.png,.jpg,.jpeg,application/pdf,text/xml,application/xml,image/png,image/jpeg';
async function uploadNF(fornecedorId, competencia, file){
  if (file.size > 10 * 1024 * 1024) throw new Error('Arquivo maior que 10 MB.');
  const nomeLimpo = file.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\-]+/g,'_').slice(-80);
  const path = `${fornecedorId}/${competencia.slice(0,7)}/${Date.now()}-${nomeLimpo}`;
  const { error } = await sb.storage.from('notas-fiscais').upload(path, file, { contentType: file.type || undefined });
  if (error) throw error;
  return { path, nome: file.name };
}

// Formulário de NF — usado pelo PJ no portal e pelo financeiro ("registrar NF recebida por e-mail")
async function nfForm(nf=null, { fornecedorId=null, depois=portalLista } = {}){
  const doFinanceiro = !!fornecedorId || (isFin() && nf);
  const forn = fornecedorId ? S.lk.fornecedores.find(f => f.id === fornecedorId) : S.fornecedor;
  // até o dia 15, o mais comum é estar enviando a nota do mês anterior
  const compPadrao = firstDay(new Date().getDate() <= 15 ? addMonths(monthKey(), -1) : monthKey());
  const initial = nf ? { ...nf } : { competencia: compPadrao, valor: forn?.valor_mensal, data_emissao: today() };
  const fields = [
    { key:'competencia', label:'Mês do serviço', type:'month', required:true, hint:'Mês em que o serviço foi prestado' },
    { key:'numero', label:'Número da NF', required:true },
    { key:'data_emissao', label:'Data de emissão', type:'date', required:true },
    { key:'valor', label:'Valor da nota (R$)', type:'money', required:true, hint: forn?.valor_mensal ? `Valor combinado: ${money(forn.valor_mensal)}` : '' },
    { key:'descricao_servico', label:'Descrição do serviço', type:'textarea' },
    { key:'arquivo', label: nf ? 'Substituir arquivo (opcional)' : 'Arquivo da nota (PDF ou XML)', type:'file', accept:ACEITOS, required:!nf, full:true, hint:'Até 10 MB' },
  ];
  const note = nf?.status === 'rejeitada' ? `Motivo da devolução: ${nf.motivo_rejeicao}` : (doFinanceiro ? `Registrando nota de ${forn?.nome}` : null);
  const ok = await formModal({ title: nf ? `NF ${nf.numero}` : 'Enviar nota fiscal', fields, initial, note, saveLabel: nf?.status === 'rejeitada' ? 'Reenviar' : 'Enviar', onSave: async d => {
    if (d.valor <= 0) throw new Error('O valor precisa ser maior que zero.');
    const fid = nf?.fornecedor_id || forn.id;
    let arq = null;
    if (d.arquivo) arq = await uploadNF(fid, d.competencia, d.arquivo);
    const row = { competencia:d.competencia, numero:d.numero.trim(), data_emissao:d.data_emissao, valor:d.valor, descricao_servico:d.descricao_servico };
    if (arq) Object.assign(row, { arquivo_path:arq.path, arquivo_nome:arq.nome });
    try {
      if (nf) await q(sb.from('notas_fiscais').update(row).eq('id', nf.id));
      else await q(sb.from('notas_fiscais').insert({ ...row, fornecedor_id: fid }));
    } catch(e) { if (arq) await sb.storage.from('notas-fiscais').remove([arq.path]); throw e; }
    if (arq && nf?.arquivo_path) await sb.storage.from('notas-fiscais').remove([nf.arquivo_path]);
    return true;
  }});
  if (ok) { toast(nf ? 'Nota atualizada.' : 'Nota enviada! O financeiro vai conferir.'); depois(); }
}

  const t = escuroAgora ? 'light' : 'dark'; store.set('fin_tema', t); aplicaTema(t);
}

// Abre enxuto: 4 números + um gráfico + destaques. Detalhes ficam nas abas.
const fmtCompacto = v => {
  const a = Math.abs(v), s = v < 0 ? '−' : '';
  if (a >= 1e6) return { n: s + 'R$ ' + (a / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 2 }), u: 'mi' };
  if (a >= 1e4) return { n: s + 'R$ ' + (a / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 1 }), u: 'mil' };
  return { n: s + BRL.format(a), u: '' };
};
const valorKpi = v => { const c = fmtCompacto(v); return html`<span title="${money(v)}">${c.n}${c.u ? html`<small>${c.u}</small>` : ''}</span>`; };
const pct = (v, d = 1) => (v * 100).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
function delta(atual, anterior, { saida = false } = {}){
  if (!anterior) return '';
  const d = (atual - anterior) / Math.abs(anterior);
  if (!isFinite(d) || Math.abs(d) < 0.0005) return html`<span class="delta">= mês anterior</span>`;
  const bom = saida ? d < 0 : d > 0;
  return html`<span class="delta ${bom ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${pct(Math.abs(d))}</span>`;
}
// agrupa linhas de vw_resultado_categoria (realizado) por um campo
const somaPor = (rows, campo) => { const o = {}; rows.forEach(r => { o[r[campo]] = (o[r[campo]] || 0) + Number(r.realizado || 0); }); return Object.entries(o).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]); };

async function viewPainel(){
  const st = store.get('fin_painel') || {};
  const mes = st.mes && st.mes <= monthKey() ? st.mes : monthKey(), ini = firstDay(mes), ant = firstDay(addMonths(mes, -1));
  const aba = st.aba || 'geral';
  const hoje = today();
  const [fluxo, saldos, res] = await Promise.all([
    q(sb.from('vw_fluxo_mensal').select('*').gte('mes', firstDay(addMonths(mes, -11))).lte('mes', firstDay(addMonths(mes, 3))).order('mes')),
    q(sb.from('vw_saldo_contas').select('*')),
    q(sb.from('vw_resultado_categoria').select('tipo,grupo,categoria,mes,realizado').in('mes', [ini, ant]).limit(5000)),
  ]);
  const fm = fluxo.find(x => x.mes === ini) || {}, fa = fluxo.find(x => x.mes === ant) || {};
  const ent = +fm.receitas_realizadas || 0, sai = +fm.despesas_realizadas || 0, entA = +fa.receitas_realizadas || 0, saiA = +fa.despesas_realizadas || 0;
  const saldoTotal = saldos.filter(x => x.tipo !== 'cartao').reduce((a, x) => a + Number(x.saldo_atual), 0);
  const semSaldoInicial = saldos.some(s => s.tipo !== 'cartao' && !s.data_saldo_inicial);
  const resMes = res.filter(r => r.mes === ini), resAnt = res.filter(r => r.mes === ant);
  const saidasGrupo = somaPor(resMes.filter(r => r.tipo === 'pagar'), 'grupo'), saidasGrupoAnt = Object.fromEntries(somaPor(resAnt.filter(r => r.tipo === 'pagar'), 'grupo'));
  const entradasCat = somaPor(resMes.filter(r => r.tipo === 'receber'), 'categoria');

  // destaques escritos a partir dos números — o que a diretoria leria primeiro
  const destaques = [];
  if (ent && entA) destaques.push(html`<span class="pos">Entradas</span> ${ent >= entA ? 'cresceram' : 'caíram'} ${pct(Math.abs(ent - entA) / entA)} em relação a ${brMonth(ant)}${entradasCat[0] ? html`, com ${entradasCat[0][0]} respondendo por ${pct(entradasCat[0][1] / entradasCat.reduce((a, x) => a + x[1], 0), 0)}` : ''}.`);
  const maiorAlta = saidasGrupo.map(([g, v]) => [g, v, saidasGrupoAnt[g] || 0]).filter(x => x[2] > 0).sort((a, b) => (b[1] - b[2]) - (a[1] - a[2]))[0];
  if (maiorAlta && maiorAlta[1] > maiorAlta[2]) destaques.push(html`A maior alta de gastos foi em <span class="neg">${maiorAlta[0]}</span>: +${money(maiorAlta[1] - maiorAlta[2])} (${pct((maiorAlta[1] - maiorAlta[2]) / maiorAlta[2])}).`);
  if (ent || sai) destaques.push(html`O mês ${ent - sai >= 0 ? 'fechou com sobra' : 'fechou com falta'} de caixa de <b class="${ent - sai >= 0 ? 'pos' : 'neg'}">${money(Math.abs(ent - sai))}</b> (entradas menos saídas pagas).`);
  if (semSaldoInicial) destaques.push(html`O caixa ainda não está confiável: falta o <a href="#/cadastros">saldo inicial</a> de alguma conta.`);

  const trocaMes = n => { st.mes = addMonths(mes, n); store.set('fin_painel', st); viewPainel(); };
  view().innerHTML = html`
    <div class="head"><div><div class="eyebrow">Visão da diretoria</div><h1>Resumo de ${MESES[+mes.slice(5) - 1]} de ${mes.slice(0, 4)}</h1>
      <p>Entradas e saídas pagas no mês, comparadas com ${brMonth(ant)}. Transferências e aportes ficam fora.${mes === monthKey() ? html` <b style="color:var(--warn)">Mês em andamento: compare com cuidado.</b>` : ''}</p></div>
      <div class="row"><button class="btn" id="mprev" title="Mês anterior">‹</button><input type="month" id="mes" value="${mes}" max="${monthKey()}"><button class="btn" id="mnext" title="Próximo mês"${mes >= monthKey() ? raw(' disabled') : ''}>›</button></div></div>
    <div class="kpis">
      <div class="card kpi"><div class="l">Entradas</div><div class="v pos">${valorKpi(ent)}</div><div class="s">${delta(ent, entA)} vs. ${brMonth(ant)}</div></div>
      <div class="card kpi"><div class="l">Saídas</div><div class="v neg">${valorKpi(sai)}</div><div class="s">${delta(sai, saiA, { saida: true })} vs. ${brMonth(ant)}</div></div>
      <div class="card kpi hl"><div class="l">Resultado de caixa</div><div class="v">${valorKpi(ent - sai)}</div><div class="s">${ent ? html`<span class="delta">${pct((ent - sai) / ent)} das entradas</span>` : 'sem entradas no mês'}</div></div>
      <div class="card kpi"><div class="l">Caixa hoje</div><div class="v">${valorKpi(saldoTotal)}</div><div class="s">${semSaldoInicial ? html`<a href="#/cadastros">defina o saldo inicial</a> para ficar correto` : 'contas correntes'}</div></div>
    </div>
    <div class="tabs" id="ptabs">${[['geral', 'Visão geral'], ['resultado', 'Resultado'], ['caixa', 'Caixa'], ['operacao', 'Operação']].map(([k, l]) => html`<button data-t="${k}" class="${k === aba ? 'on' : ''}">${l}</button>`)}</div>
    <div id="paba"></div>`.s;

  const abas = {
    geral: () => html`
      <div class="grid2">
        <div class="card"><div class="band"><h2>Entradas × saídas</h2><div class="legend"><span><i style="background:var(--pos)"></i>Entradas</span><span><i style="background:var(--neg)"></i>Saídas</span><span><i style="background:var(--brand)"></i>Resultado</span></div></div>
          <div class="chart-wrap">${chartEntSai(fluxo, mes)}</div></div>
        <div class="card"><div class="band"><h2>Composição das entradas</h2><span class="muted">${brMonth(ini)}</span></div>
          ${entradasCat.length ? donut(entradasCat, ['--pos', '--brand-2', '--sage', '--sand', '--pos-2', '--terra']) : html`<div class="empty">Nenhuma entrada paga neste mês.</div>`}</div>
      </div>
      ${destaques.length ? html`<div class="card pad destaques"><b>Destaques de ${brMonth(ini)}</b><ul>${destaques.map(d => html`<li>${d}</li>`)}</ul></div>` : ''}`,
    resultado: () => html`
      <div class="grid2">
        <div class="card"><div class="band"><h2>Das entradas ao resultado</h2><span class="muted">${brMonth(ini)} · competência</span></div>
          <div class="chart-wrap">${cascata(resMes)}</div></div>
        <div class="card"><div class="band"><h2>Para onde foi o dinheiro</h2><span class="muted">saídas de ${brMonth(ini)}</span></div>
          ${saidasGrupo.length ? donut(saidasGrupo, ['--neg', '--terra', '--sand', '--sage', '--sage-2', '--neg-2', '--pos-2', '--brand-2', '--line-2']) : html`<div class="empty">Nenhuma saída paga neste mês.</div>`}</div>
      </div>
      <p class="small muted">O demonstrativo completo, linha a linha, está em <a href="#/relatorios">Demonstrativo (DRE)</a>.</p>`,
    caixa: () => html`<div class="card"><div class="band"><h2>Caixa · próximos 90 dias</h2><span class="muted">saldo de hoje + contas previstas pelo vencimento</span></div><div class="chart-wrap" id="proj"><div class="empty">Calculando…</div></div></div>`,
    operacao: () => html`<div id="oper"><div class="empty">Carregando…</div></div>`,
  };
  const abrir = async k => {
    st.aba = k; store.set('fin_painel', st);
    $$('#ptabs button').forEach(b => b.classList.toggle('on', b.dataset.t === k));
    $('#paba').innerHTML = abas[k]().s;
    if (k === 'caixa') await projecaoCaixa(saldoTotal, semSaldoInicial);
    if (k === 'operacao') await painelOperacao(mes);
  };
  $$('#ptabs button').forEach(b => b.onclick = () => abrir(b.dataset.t));
  $('#mprev').onclick = () => trocaMes(-1);
  $('#mnext').onclick = () => trocaMes(1);
  $('#mes').onchange = e => { if (e.target.value) { st.mes = e.target.value; store.set('fin_painel', st); viewPainel(); } };
  await abrir(aba);
}

// rosca + legenda. itens = [[nome, valor], ...]; mostra no máximo 6 fatias (o resto vira "Outros")
function donut(itens, cores){
  let lista = itens.slice(0, 6);
  if (itens.length > 6) lista = [...itens.slice(0, 5), ['Outros', itens.slice(5).reduce((a, x) => a + x[1], 0)]];
  const total = lista.reduce((a, x) => a + x[1], 0), r = 44, c = 2 * Math.PI * r;
  let off = 0, s = `<svg class="donut" viewBox="0 0 120 120" role="img" aria-label="Distribuição">`;
  lista.forEach(([n, v], i) => { const len = v / total * c; s += `<circle cx="60" cy="60" r="${r}" fill="none" stroke="var(${cores[i % cores.length]})" stroke-width="20" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"><title>${esc(n)}: ${esc(money(v))}</title></circle>`; off += len; });
  const tc = fmtCompacto(total);
  s += `<text x="60" y="56" text-anchor="middle" font-size="9" fill="var(--ink-3)">total</text><text x="60" y="71" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)">${esc(tc.n.replace('R$ ', ''))} ${tc.u}</text></svg>`;
  const curto = v => { const c = fmtCompacto(v); return c.n.replace('R$ ', '') + (c.u ? ' ' + c.u : ''); };
  return html`<div class="donut-wrap">${raw(s)}<div class="lg">${lista.map(([n, v], i) => html`<div><i style="background:var(${cores[i % cores.length]})"></i><span title="${n}">${n}</span><span class="num" title="${money(v)}">${curto(v)}</span><span class="p">${pct(v / total, 0)}</span></div>`)}
    <div class="tot"><i></i><span>Total</span><span class="num" title="${money(total)}">${curto(total)}</span><span class="p"></span></div></div></div>`;
}

// barras de entradas e saídas (12 meses + 3 previstos) com a linha do resultado
function chartEntSai(rows, atual){
  const meses = []; for (let i = -11; i <= 3; i++) meses.push(addMonths(atual, i));
  const d = meses.map(m => { const r = rows.find(x => x.mes === firstDay(m)) || {}; const fut = m > monthKey(); return { m, fut, e: fut ? +r.receitas_previstas || 0 : +r.receitas_realizadas || 0, s: fut ? +r.despesas_previstas || 0 : +r.despesas_realizadas || 0 }; })
    .filter((x, i, arr) => x.e || x.s || x.m === atual || arr.slice(0, i).some(y => y.e || y.s));
  const W = 680, H = 260, L = 50, R = 8, T = 12, B = 222, max = Math.max(1, ...d.map(x => Math.max(x.e, x.s)));
  const y = v => B - Math.max(0, v) / max * (B - T), step = (W - L - R) / d.length, bw = Math.min(20, step * .32);
  const fmtK = v => v >= 1e6 ? (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi' : v >= 1e3 ? Math.round(v / 1e3) + ' mil' : Math.round(v);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas por mês">`;
  [0, .25, .5, .75, 1].forEach(t => s += `<line x1="${L}" x2="${W - R}" y1="${y(max * t)}" y2="${y(max * t)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(max * t) + 4}" text-anchor="end" font-size="10.5" fill="var(--ink-3)">${fmtK(max * t)}</text>`);
  d.forEach((x, i) => {
    const cx = L + step * i + step / 2, on = x.m === atual, op = x.fut ? .35 : on ? 1 : .55;
    s += `<rect x="${cx - bw - 1.5}" y="${y(x.e)}" width="${bw}" height="${B - y(x.e)}" rx="3" fill="var(--pos)" opacity="${op}"><title>${esc(brMonth(firstDay(x.m)))} · entradas ${x.fut ? 'previstas' : ''}: ${esc(money(x.e))}</title></rect>`;
    s += `<rect x="${cx + 1.5}" y="${y(x.s)}" width="${bw}" height="${B - y(x.s)}" rx="3" fill="var(--neg)" opacity="${op}"><title>${esc(brMonth(firstDay(x.m)))} · saídas ${x.fut ? 'previstas' : ''}: ${esc(money(x.s))}</title></rect>`;
    s += `<text x="${cx}" y="${B + 18}" text-anchor="middle" font-size="11" fill="var(${on ? '--ink' : '--ink-3'})" font-weight="${on ? 700 : 400}">${esc(brMonth(firstDay(x.m)).slice(0, 3))}</text>`;
  });
  const real = d.map((x, i) => [i, x]).filter(([, x]) => !x.fut);
  if (real.length > 1) {
    s += `<path d="${real.map(([i, x], k) => `${k ? 'L' : 'M'}${L + step * i + step / 2},${y(x.e - x.s)}`).join(' ')}" fill="none" stroke="var(--brand)" stroke-width="2.2" stroke-linejoin="round"/>`;
    real.forEach(([i, x]) => s += `<circle cx="${L + step * i + step / 2}" cy="${y(x.e - x.s)}" r="${x.m === atual ? 4.5 : 3}" fill="var(--surface)" stroke="var(--brand)" stroke-width="2"><title>${esc(brMonth(firstDay(x.m)))} · resultado: ${esc(money(x.e - x.s))}</title></circle>`);
  }
  return raw(s + '</svg>');
}

// cascata por competência: entradas → cada grupo de despesa → resultado
function cascata(resMes){
  const ent = resMes.filter(r => r.tipo === 'receber').reduce((a, r) => a + Number(r.realizado || 0), 0);
  if (!ent) return html`<div class="empty">Sem receitas com competência neste mês.</div>`;
  const grupos = somaPor(resMes.filter(r => r.tipo === 'pagar'), 'grupo');
  const lista = grupos.length > 6 ? [...grupos.slice(0, 5), ['Outros', grupos.slice(5).reduce((a, x) => a + x[1], 0)]] : grupos;
  const passos = [['Receitas', ent, 'ini'], ...lista.map(([g, v]) => [g, -v]), ['Resultado', ent - grupos.reduce((a, x) => a + x[1], 0), 'fim']];
  const W = 760, L = 10, T = 22, B = 236, bw = Math.min(64, (W - 2 * L) / passos.length * .62), gap = (W - 2 * L - bw * passos.length) / (passos.length - 1);
  const topo = Math.max(ent, 1), base = Math.min(0, passos[passos.length - 1][1]);
  const y = v => T + (topo - v) / (topo - base) * (B - T);
  let acc = 0, s = `<svg viewBox="0 0 ${W} ${B + 44}" role="img" aria-label="Das entradas ao resultado">`;
  s += `<line x1="${L}" x2="${W - L}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line-2)"/>`;
  passos.forEach(([n, v, k], i) => {
    const x = L + i * (bw + gap); let y0, y1, cor;
    if (k === 'ini') { y0 = y(v); y1 = y(0); acc = v; cor = '--pos'; }
    else if (k === 'fim') { y0 = y(Math.max(v, 0)); y1 = y(Math.min(v, 0)); cor = v >= 0 ? '--brand' : '--neg'; }
    else { const a = acc; acc += v; y0 = y(Math.max(a, acc)); y1 = y(Math.min(a, acc)); cor = '--neg'; }
    s += `<rect x="${x}" y="${y0}" width="${bw}" height="${Math.max(2, y1 - y0)}" rx="5" fill="var(${cor})" opacity="${k ? 1 : .85}"><title>${esc(n)}: ${esc(money(v))}</title></rect>`;
    const c = fmtCompacto(v);
    s += `<text x="${x + bw / 2}" y="${y0 - 7}" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(${k ? '--ink' : '--neg'})">${esc(c.n.replace('R$ ', ''))}${c.u ? ' ' + c.u : ''}</text>`;
    const partes = String(n).length > 12 ? [String(n).slice(0, String(n).lastIndexOf(' ', 12) > 0 ? String(n).lastIndexOf(' ', 12) : 12), String(n).slice((String(n).lastIndexOf(' ', 12) > 0 ? String(n).lastIndexOf(' ', 12) : 12)).trim()] : [n];
    partes.forEach((p, j) => s += `<text x="${x + bw / 2}" y="${B + 18 + j * 13}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${esc(p.length > 14 ? p.slice(0, 13) + '…' : p)}</text>`);
  });
  return raw(s + '</svg>');
}

// saldo de hoje + o que vence nos próximos 90 dias (lançamentos em aberto e faturas de cartão)
async function projecaoCaixa(saldo, semSaldoInicial){
  const hoje = today(), fim = iso(new Date(Date.now() + 90 * 864e5));
  const [lancs, fats] = await Promise.all([
    q(sb.from('vw_lancamentos').select('tipo,valor,data_vencimento,categoria_tipo').in('status', ['previsto', 'aprovado']).is('fatura_id', null).gte('data_vencimento', hoje).lte('data_vencimento', fim).limit(5000)),
    q(sb.from('vw_faturas').select('total,data_vencimento').neq('status', 'paga').gte('data_vencimento', hoje).lte('data_vencimento', fim)).catch(() => []),
  ]);
  const mov = {};
  lancs.filter(l => l.categoria_tipo !== 'neutra').forEach(l => mov[l.data_vencimento] = (mov[l.data_vencimento] || 0) + (l.tipo === 'receber' ? 1 : -1) * Number(l.valor));
  fats.forEach(f => mov[f.data_vencimento] = (mov[f.data_vencimento] || 0) - Number(f.total));
  const pts = []; let s = saldo, min = { v: saldo, d: hoje };
  for (let i = 0; i <= 90; i++) { const d = iso(new Date(Date.now() + i * 864e5)); s += mov[d] || 0; pts.push([d, s]); if (s < min.v) min = { v: s, d }; }
  const W = 680, H = 250, L = 56, R = 10, T = 12, B = 214;
  const lo = Math.min(0, ...pts.map(p => p[1])), hi = Math.max(1, ...pts.map(p => p[1]));
  const x = i => L + i / 90 * (W - L - R), y = v => B - (v - lo) / (hi - lo) * (B - T);
  const fmtK = v => { const c = fmtCompacto(v); return c.n.replace('R$ ', '') + (c.u ? ' ' + c.u : ''); };
  let o = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Projeção de caixa">`;
  [0, .25, .5, .75, 1].forEach(t => { const v = lo + (hi - lo) * t; o += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" fill="var(--ink-3)">${esc(fmtK(v))}</text>`; });
  if (lo < 0) o += `<rect x="${L}" y="${y(0)}" width="${W - L - R}" height="${B - y(0)}" fill="var(--neg-soft)"/><line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--neg)" stroke-dasharray="4 4"/>`;
  const dd = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i)},${y(p[1])}`).join(' ');
  o += `<path d="${dd} L${x(90)},${B} L${x(0)},${B} Z" fill="var(--brand)" opacity=".1"/><path d="${dd}" fill="none" stroke="var(--brand)" stroke-width="2.2" stroke-linejoin="round"/>`;
  const im = pts.findIndex(p => p[0] === min.d);
  o += `<circle cx="${x(im)}" cy="${y(min.v)}" r="5" fill="var(--surface)" stroke="var(${min.v < 0 ? '--neg' : '--warn'})" stroke-width="2.5"><title>menor saldo: ${esc(money(min.v))} em ${esc(brDate(min.d))}</title></circle>`;
  [0, 30, 60, 90].forEach(i => o += `<text x="${x(i)}" y="${B + 20}" text-anchor="${i === 0 ? 'start' : i === 90 ? 'end' : 'middle'}" font-size="11" fill="var(--ink-3)">${esc(brDate(pts[i][0]).slice(0, 5))}</text>`);
  $('#proj').innerHTML = o + '</svg>';
  $('#proj').insertAdjacentHTML('afterend', html`<div class="note${min.v < 0 ? ' neg' : ''}" style="margin:0 20px 18px">${semSaldoInicial ? html`<b>Atenção:</b> sem o saldo inicial das contas, o ponto de partida está errado. ` : ''}Menor saldo previsto: <b>${money(min.v)}</b> em ${brDate(min.d)}. Considera só o que já está lançado como previsto ou aprovado — gere as contas fixas dos próximos meses para a projeção ficar completa.</div>`.s);
}

// a antiga visão operacional: o que precisa de ação agora
async function painelOperacao(mes){
  const ini = firstDay(mes), fim = lastDay(mes), hoje = today(), em10 = iso(new Date(Date.now() + 10 * 864e5));
  const [aberto, atrasados, prox, saldos, nfs] = await Promise.all([
    q(sb.from('vw_lancamentos').select('tipo,valor').in('status', ['previsto', 'aprovado']).gte('data_vencimento', ini).lte('data_vencimento', fim)),
    q(sb.from('vw_lancamentos').select('tipo,valor').eq('situacao', 'atrasado')),
    q(sb.from('vw_lancamentos').select('id,tipo,descricao,valor,data_vencimento,fornecedor,situacao,aguardando_nf').in('status', ['previsto', 'aprovado']).is('fatura_id', null).gte('data_vencimento', hoje).lte('data_vencimento', em10).order('data_vencimento').limit(10)),
    q(sb.from('vw_saldo_contas').select('*')),
    q(sb.from('notas_fiscais').select('valor').eq('status', 'enviada')),
  ]);
  const fatsProx = await q(sb.from('vw_faturas').select('cartao,total,data_vencimento').neq('status', 'paga').gte('data_vencimento', hoje).lte('data_vencimento', em10)).catch(() => []);
  prox.push(...fatsProx.filter(f => Number(f.total) > 0).map(f => ({ tipo: 'pagar', descricao: `Fatura ${f.cartao}`, valor: f.total, data_vencimento: f.data_vencimento })));
  prox.sort((a, b) => a.data_vencimento.localeCompare(b.data_vencimento));
  const sum = (arr, t) => arr.filter(x => !t || x.tipo === t).reduce((a, x) => a + Number(x.valor), 0);
  const pend = saldos.reduce((a, s) => a + (s.pendentes || 0), 0), cartoes = -saldos.filter(s => s.tipo === 'cartao').reduce((a, s) => a + Number(s.saldo_atual), 0);
  // só mostra o que pede ação; o que está zerado vira uma linha de "em dia"
  const itens = [
    [sum(aberto, 'pagar'), html`<div class="card kpi"><div class="l">A pagar em ${brMonth(ini)}</div><div class="v neg">${valorKpi(sum(aberto, 'pagar'))}</div><div class="s">em aberto · <a href="#/pagar">ver</a></div></div>`, 'nada a pagar em aberto no mês'],
    [sum(aberto, 'receber'), html`<div class="card kpi"><div class="l">A receber em ${brMonth(ini)}</div><div class="v pos">${valorKpi(sum(aberto, 'receber'))}</div><div class="s">em aberto · <a href="#/receber">ver</a></div></div>`, 'nada a receber em aberto no mês'],
    [atrasados.length, html`<div class="card kpi"><div class="l">Atrasados</div><div class="v neg">${atrasados.length}</div><div class="s">${money(sum(atrasados, 'pagar'))} a pagar · ${money(sum(atrasados, 'receber'))} a receber</div></div>`, 'nenhum atrasado'],
    [nfs.length, html`<div class="card kpi"><div class="l">NFs para conferir</div><div class="v">${nfs.length}</div><div class="s">${money(sum(nfs))} · <a href="#/notas">conferir</a></div></div>`, 'nenhuma NF esperando'],
    [pend, html`<div class="card kpi"><div class="l">Extrato a conciliar</div><div class="v">${pend}</div><div class="s">${saldos.filter(s => s.pendentes).map(s => s.nome).join(', ')} · <a href="#/conciliacao">conciliar</a></div></div>`, 'extrato em dia'],
    [cartoes, html`<div class="card kpi"><div class="l">Cartões em aberto</div><div class="v neg">${valorKpi(cartoes)}</div><div class="s"><a href="#/cartoes">ver faturas</a></div></div>`, 'nenhuma fatura em aberto'],
  ];
  const emDia = itens.filter(i => !i[0]).map(i => i[2]);
  $('#oper').innerHTML = html`
    ${isFin() ? html`<div class="row" style="justify-content:flex-end;margin-bottom:14px"><button class="btn" id="gerar">Gerar contas fixas de ${brMonth(ini)}</button><a class="btn pri" href="#/pagar">Novo lançamento</a></div>` : ''}
    ${itens.some(i => i[0]) ? html`<div class="kpis">${itens.filter(i => i[0]).map(i => i[1])}</div>` : ''}
    ${emDia.length ? html`<p class="small muted" style="margin:-4px 0 16px">✓ Em dia: ${emDia.join(' · ')}.</p>` : ''}
    <div class="card"><div class="band"><h2>Próximos 10 dias</h2></div><div style="padding:4px 20px 8px">
      ${prox.length ? prox.map(l => html`<div class="list-item"><div><div>${l.descricao}</div><div class="small muted">${brDate(l.data_vencimento)}${l.fornecedor ? ' · ' + l.fornecedor : ''}${l.aguardando_nf ? html` · <span class="pill p-enviada">aguarda NF</span>` : ''}</div></div><div class="num ${l.tipo === 'pagar' ? 'neg' : 'pos'}">${l.tipo === 'pagar' ? '−' : '+'}${money(l.valor)}</div></div>`) : html`<div class="empty">Nada vencendo nos próximos 10 dias.</div>`}
    </div></div>`.s;
  $('#gerar')?.addEventListener('click', () => gerarRecorrencias(mes));
}

async function gerarRecorrencias(mes){
  try { const n = await q(sb.rpc('gerar_recorrencias', { p_mes: firstDay(mes) })); toast(n ? `${n} lançamentos gerados para ${brMonth(firstDay(mes))}.` : `Nada novo: ${brMonth(firstDay(mes))} já estava gerado.`); route(); }
  catch(e) { toast(errMsg(e), true); }
}

// ---------------------------------------------------------- LANÇAMENTOS ----
const PAGE = 50;
function lancFields(tipo){
  const catFilter = c => tipo === 'pagar' ? c.tipo !== 'receita' : c.tipo !== 'despesa';
  return [
    { key:'descricao', label:'Descrição', required:true, full:true },
    { key:'fornecedor_id', label: tipo === 'pagar' ? 'Fornecedor / pessoa' : 'Cliente', type:'select', options:() => opts(S.lk.fornecedores),
      onChange:(d, form) => { const f = S.lk.fornecedores.find(x => x.id === d.fornecedor_id); if (!f) return;
        if (!form.elements.categoria_id.value && f.categoria_padrao_id) form.elements.categoria_id.value = f.categoria_padrao_id;
        if (!form.elements.centro_custo_id.value && f.centro_custo_padrao_id) form.elements.centro_custo_id.value = f.centro_custo_padrao_id;
        if (!form.elements.conta_id.value && f.conta_padrao_id) form.elements.conta_id.value = f.conta_padrao_id;
        if (!form.elements.valor.value && (f.valor_mensal || f.salario_bruto)) form.elements.valor.value = moneyInput(f.valor_mensal || f.salario_bruto); } },
    { key:'valor', label:'Valor (R$)', type:'money', required:true },
    { key:'categoria_id', label:'Categoria', type:'select', required:true, options:() => opts(S.lk.categorias, catFilter) },
    { key:'centro_custo_id', label:'Centro de custo/lucro', type:'select', options:() => opts(S.lk.centros) },
    { key:'conta_id', label:'Conta ou cartão', type:'select', options:() => S.lk.contas.filter(c => c.ativo !== false).map(c => ({ value:c.id, label: c.nome + (c.tipo === 'cartao' ? ' (cartão)' : '') })), hint:'Escolhendo um cartão, a compra entra na fatura certa sozinha' },
    { key:'data_competencia', label:'Competência', type:'month', required:true, hint:'Mês a que pertence (DRE)' },
    { key:'data_documento', label:'Data da compra / emissão', type:'date' },
    { key:'data_vencimento', label:'Vencimento', type:'date', required:true },
    { key:'status', label:'Status', type:'select', required:true, options:[{value:'previsto',label:'Previsto'},{value:'aprovado',label:'Aprovado'},{value:'pago',label: tipo === 'pagar' ? 'Pago' : 'Recebido'},{value:'cancelado',label:'Cancelado'}] },
    { key:'data_pagamento', label: tipo === 'pagar' ? 'Data do pagamento' : 'Data do recebimento', type:'date', hint:'Obrigatória se status = pago' },
    { key:'forma_pagamento', label:'Forma', type:'select', options:[['pix','PIX'],['boleto','Boleto'],['transferencia','Transferência'],['cartao_credito','Cartão de crédito'],['debito_automatico','Débito automático'],['dinheiro','Dinheiro'],['outro','Outro']].map(([value,label]) => ({value,label})) },
    { key:'custo_nivel', label:'Nível de custo', type:'select', options:[{value:'fixo',label:'Fixo'},{value:'variavel',label:'Variável'}] },
    { key:'projeto_id', label:'Projeto / evento', type:'select', options:() => opts(S.lk.projetos) },
    { key:'tags', label:'Tags', type:'tags' },
    { key:'codigo_barras', label:'Código de barras / linha digitável do boleto', full:true },
    { key:'observacoes', label:'Observações', type:'textarea' },
  ];
}
const LANC_COLS = ['descricao','fornecedor_id','valor','categoria_id','centro_custo_id','conta_id','data_competencia','data_vencimento','data_documento','status','data_pagamento','forma_pagamento','custo_nivel','projeto_id','tags','codigo_barras','observacoes'];
function limpaLanc(d, tipo){
  const o = { tipo }; LANC_COLS.forEach(k => o[k] = d[k] ?? (k === 'tags' ? [] : null));
  if (o.status === 'pago' && !o.data_pagamento) o.data_pagamento = o.data_vencimento <= today() ? o.data_vencimento : today();
  if (o.status !== 'pago') o.data_pagamento = null;
  return o;
}
async function editarLanc(tipo, row=null, dup=false, depois=route){
  const initial = row ? { ...row } : { status:'previsto', data_competencia: firstDay(monthKey()), data_vencimento: today(), tags:[] };
  if (dup) { initial.status = 'previsto'; initial.data_pagamento = null; }
  const ok = await formModal({ title: row && !dup ? 'Editar lançamento' : (tipo === 'pagar' ? 'Nova conta a pagar' : 'Nova conta a receber'), fields: lancFields(tipo), initial,
    note: row?.conciliado && !dup ? 'Este lançamento está conciliado com o extrato. Para mudar valor ou data, desfaça a conciliação em Conciliação bancária.' : row?.fatura_id && row?.id && !dup ? 'Compra de cartão: vencimento e status vêm da fatura.' : row?.nota_fiscal_id ? 'Este lançamento está ligado a uma nota fiscal. Ao marcar como pago, o PJ vê a nota como paga no portal.' : null,
    onSave: async d => { const o = limpaLanc(d, tipo); if (row && !dup) await q(sb.from('lancamentos').update(o).eq('id', row.id)); else await q(sb.from('lancamentos').insert(o)); } });
  if (ok) { toast('Salvo.'); depois(); }
}

async function viewLancamentos(tipo){

    if (st.situacao === 'abertos') qb = qb.in('status', ['previsto','aprovado']);

    if (st.categoria) qb = qb.eq('categoria_id', st.categoria);
    if (st.centro) qb = qb.eq('centro_custo_id', st.centro);
    if (st.semCartao) qb = qb.is('fatura_id', null);
    const { data:rows, count } = await q(qb.order('data_vencimento').order('descricao').range(st.page*PAGE, st.page*PAGE + PAGE - 1));
    let totQ = sb.from('vw_lancamentos').select('valor,situacao').eq('tipo', tipo);
    if (st.mes) totQ = totQ.gte('data_vencimento', firstDay(st.mes)).lte('data_vencimento', lastDay(st.mes));
    if (st.categoria) totQ = totQ.eq('categoria_id', st.categoria);
    if (st.centro) totQ = totQ.eq('centro_custo_id', st.centro);
    if (st.semCartao) totQ = totQ.is('fatura_id', null);
    const tot = await q(totQ.neq('status','cancelado').limit(10000));

        <div class="card kpi"><div class="l">Já ${verbo}</div><div class="v pos">${money(soma(x => x.situacao === 'pago'))}</div></div>
        <div class="card kpi"><div class="l">Em aberto</div><div class="v">${money(soma(x => ['previsto','aprovado'].includes(x.situacao)))}</div></div>
        <div class="card kpi"><div class="l">Atrasado</div><div class="v neg">${money(soma(x => x.situacao === 'atrasado'))}</div></div>

      try { await q(sb.from('lancamentos').delete().eq('id', l.id)); toast('Excluído.'); render(); } catch(e) { toast(errMsg(e), true); } });
    const sel = () => $$('[data-sel]:checked').map(c => byId(c.dataset.sel));
    const upd = () => { const n = sel().length; const b = $('#bulk'); if (!b) return; b.style.display = n ? 'flex' : 'none'; $('#bulkn').textContent = `${n} selecionado(s) · ${money(sel().reduce((a,x) => a + Number(x.valor), 0))}`; };
    $$('[data-sel]').forEach(c => c.onchange = upd);
    $('#all')?.addEventListener('change', e => { $$('[data-sel]:not(:disabled)').forEach(c => c.checked = e.target.checked); upd(); });
    $('#bpago')?.addEventListener('click', () => marcarPago(sel(), tipo));
    $('#baprov')?.addEventListener('click', async () => { try { await q(sb.from('lancamentos').update({ status:'aprovado' }).in('id', sel().map(x => x.id)).eq('status','previsto')); toast('Aprovados.'); render(); } catch(e) { toast(errMsg(e), true); } });
  };
  await render();
}

async function marcarPago(list, tipo){
  if (!list.length) return;
  const semNF = list.filter(l => l.aguardando_nf);
  const ok = await formModal({ title: `Marcar ${list.length} como ${tipo === 'pagar' ? 'pago' : 'recebido'}`,
    note: semNF.length ? `Atenção: ${semNF.length} lançamento(s) de PJ ainda sem nota fiscal aprovada (${semNF.map(l => l.fornecedor || l.descricao).join(', ')}).` : `Total: ${money(list.reduce((a,x) => a + Number(x.valor), 0))}`,
    fields:[{ key:'data', label:'Data', type:'date', required:true }], initial:{ data: today() },
    onSave: async d => { await q(sb.from('lancamentos').update({ status:'pago', data_pagamento:d.data }).in('id', list.map(x => x.id))); } });
  if (ok) { toast('Pronto.'); route(); }
}

async function viewNotas(){
  const st = store.get('fin_filtro_nf') || { aba:'enviada', comp: firstDay(addMonths(monthKey(), -1)) };
  const render = async () => {
    store.set('fin_filtro_nf', st);
    const abas = [['enviada','Para conferir'],['aprovada','Aprovadas'],['rejeitada','Devolvidas'],['paga','Pagas'],['todas','Todas'],['faltando','Quem ainda não enviou']];
    let corpo;
    if (st.aba === 'faltando') corpo = await notasFaltando(st);
    else {
      let qb = sb.from('notas_fiscais').select('*, fornecedores(nome, valor_mensal, email, chave_pix)').order('created_at', { ascending: st.aba === 'enviada' });
      if (st.aba !== 'todas') qb = qb.eq('status', st.aba);
      if (st.aba !== 'enviada') qb = qb.limit(200);
      const rows = await q(qb);
      corpo = rows.length ? html`<div class="tbl-wrap"><table><thead><tr><th>Prestador</th><th>Competência</th><th>NF</th><th class="r">Valor</th><th>Situação</th><th></th></tr></thead><tbody>
        ${rows.map(n => { const esp = n.fornecedores?.valor_mensal; const dif = esp && Math.abs(Number(n.valor) - Number(esp)) >= 0.01;
          return html`<tr><td><div>${n.fornecedores?.nome}</div><div class="small muted">enviada ${brDate(n.created_at)}${n.fornecedores?.chave_pix ? '' : html` · <span class="neg">sem PIX</span>`}</div></td>
          <td>${brMonth(n.competencia)}</td><td><div>${n.numero}</div><div class="small muted">${n.data_emissao ? 'emissão ' + brDate(n.data_emissao) : ''}</div></td>
          <td class="r"><div class="num">${money(n.valor)}</div>${dif ? html`<div class="small ${Number(n.valor) > Number(esp) ? 'neg' : 'muted'}">combinado ${money(esp)}</div>` : ''}</td>
          <td>${pill(n.status)}${n.status === 'rejeitada' ? html`<div class="small muted">${n.motivo_rejeicao}</div>` : ''}${n.data_prevista_pagamento && n.status === 'aprovada' ? html`<div class="small muted">paga em ${brDate(n.data_prevista_pagamento)}</div>` : ''}</td>
          <td class="r"><div class="row" style="justify-content:flex-end;flex-wrap:nowrap">
            <button class="btn sm" data-ver="${n.id}">Abrir</button>
            ${isFin() && n.status === 'enviada' ? html`<button class="btn sm ok" data-apr="${n.id}">Aprovar</button><button class="btn sm danger" data-rej="${n.id}">Devolver</button>` : ''}
            ${isFin() && n.status === 'aprovada' ? html`<button class="btn sm" data-undo="${n.id}">Desfazer</button>` : ''}
          </div></td></tr>`; })}
      </tbody></table></div>` : html`<div class="empty">${st.aba === 'enviada' ? 'Nenhuma nota esperando conferência. 🎉' : 'Nada por aqui.'}</div>`;
      corpo._rows = rows;
    }
    view().innerHTML = html`<div class="head"><div><h1>Notas fiscais</h1><p>Enviadas pelos prestadores no portal. Aprovar gera (ou confirma) a conta a pagar.</p></div>
      ${isFin() ? html`<button class="btn" id="reg">Registrar NF recebida por e-mail</button>` : ''}</div>
      <div class="tabs">${abas.map(([k,l]) => html`<button data-aba="${k}" class="${st.aba === k ? 'on' : ''}">${l}</button>`)}</div>
      <div class="card">${corpo}</div>`.s;
    $$('[data-aba]').forEach(b => b.onclick = () => { st.aba = b.dataset.aba; render(); });
    $('#reg')?.addEventListener('click', async () => {
      const r = await formModal({ title:'Registrar NF', fields:[{ key:'f', label:'Prestador', type:'select', required:true, options:() => opts(S.lk.fornecedores, f => f.ativo && ['pj','fornecedor'].includes(f.tipo)) }], saveLabel:'Continuar' });
      if (r?.f) nfForm(null, { fornecedorId: r.f, depois: render });
    });
    const rows = corpo._rows || [];
    const byId = id => rows.find(r => r.id === id);
    $$('[data-ver]').forEach(b => b.onclick = () => abrirArquivo(byId(b.dataset.ver).arquivo_path));
    $$('[data-apr]').forEach(b => b.onclick = async () => { const n = byId(b.dataset.apr); const esp = n.fornecedores?.valor_mensal;
      const ok = await formModal({ title:`Aprovar NF ${n.numero} · ${n.fornecedores?.nome}`,
        note: `${money(n.valor)} referente a ${brMonth(n.competencia)}.${esp && Math.abs(n.valor - esp) >= .01 ? ` Atenção: o valor combinado é ${money(esp)}.` : ''} Se já existir a previsão desse PJ no mês (recorrência), ela é confirmada com o valor da nota; se não, uma conta a pagar nova é criada.`,
        fields:[{ key:'venc', label:'Data de pagamento (opcional)', type:'date', hint:'Em branco = dia de pagamento do cadastro, no mês seguinte à competência' }], saveLabel:'Aprovar',
        onSave: async d => q(sb.rpc('aprovar_nota_fiscal', { p_nf:n.id, p_vencimento:d.venc || null })) });
      if (ok) { toast('Nota aprovada e conta a pagar criada/confirmada.'); render(); } });
    $$('[data-rej]').forEach(b => b.onclick = async () => { const n = byId(b.dataset.rej);
      const ok = await formModal({ title:`Devolver NF ${n.numero}`, note:'O prestador vê este motivo no portal e pode corrigir e reenviar.',
        fields:[{ key:'motivo', label:'Motivo', type:'textarea', required:true }], saveLabel:'Devolver',

    $$('[data-undo]').forEach(b => b.onclick = async () => { const n = byId(b.dataset.undo);
      if (!await confirmar('Desfazer aprovação', `A NF ${n.numero} volta para “para conferir”. A conta a pagar volta a ser previsão (se veio de recorrência) ou é cancelada.`)) return;

    $('#fcomp')?.addEventListener('change', e => { st.comp = e.target.value + '-01'; render(); });
    $$('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); toast('Mensagem copiada.'); } catch { toast('Não consegui copiar. Selecione e copie manualmente.', true); } });
  };
  await render();
}

async function notasFaltando(st){
  const [forn, nfs, perfis] = await Promise.all([
    q(sb.from('fornecedores').select('id,nome,email,valor_mensal').eq('ativo', true).eq('exige_nf', true).order('nome')),
    q(sb.from('notas_fiscais').select('fornecedor_id').eq('competencia', st.comp)),
    q(sb.from('perfis').select('fornecedor_id').not('fornecedor_id','is',null)),
  ]);
  const enviou = new Set(nfs.map(n => n.fornecedor_id)), temLogin = new Set(perfis.map(p => p.fornecedor_id));
  const falta = forn.filter(f => !enviou.has(f.id));
  const link = location.origin + location.pathname;
  const msg = f => `Oi, ${f.nome.split(' ')[0]}! Ainda não recebemos sua NF de ${brMonth(st.comp)}. Envie pelo portal: ${link} (prazo: dia ${S.params?.dia_limite_envio_nf || 25}).`;
  return html`<div class="filters"><label class="small muted">Competência</label><input type="month" id="fcomp" value="${st.comp.slice(0,7)}"><span class="small muted grow">${falta.length} de ${forn.length} prestadores com “exige NF” ainda não enviaram.</span></div>
    ${falta.length ? html`<div class="tbl-wrap"><table><thead><tr><th>Prestador</th><th>Acesso ao portal</th><th class="r">Valor combinado</th><th></th></tr></thead><tbody>
      ${falta.map(f => html`<tr><td>${f.nome}</td>
        <td class="small">${!f.email ? html`<span class="neg">sem e-mail no cadastro</span> — não consegue acessar` : temLogin.has(f.id) ? html`<span class="ok">ativo</span> · ${f.email}` : html`<span class="muted">e-mail cadastrado, ainda não criou login</span> · ${f.email}`}</td>
        <td class="r num">${money(f.valor_mensal)}</td><td class="r"><button class="btn sm" data-copy="${msg(f)}">Copiar lembrete</button></td></tr>`)}
    </tbody></table></div>` : html`<div class="empty">Todo mundo enviou. 👏</div>`}`;
}

    ${isFin() ? html`<div class="row"><input type="month" id="gm" value="${monthKey()}"><button class="btn" id="gerar">Gerar lançamentos do mês</button><button class="btn pri" id="novo">+ Nova</button></div>` : ''}</div>
    <div class="note info" style="margin-bottom:14px">Gerar é seguro de repetir: o sistema não duplica o que já foi gerado. Recorrências de PJ marcadas com “aguarda NF” geram a previsão com competência do mês anterior (o pagamento de outubro é do serviço de setembro) e só viram “aprovado” quando a nota for aprovada.</div>
    <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Descrição</th><th>Categoria</th><th>Dia</th><th>Periodicidade</th><th class="r">Valor</th><th></th></tr></thead><tbody>
      ${rows.map(r => html`<tr style="${r.ativo ? '' : 'opacity:.5'}"><td><div>${r.descricao}</div><div class="small muted">${r.tipo === 'pagar' ? 'a pagar' : 'a receber'}${r.fornecedores ? ' · ' + r.fornecedores.nome : ''}${r.aguarda_nf ? ' · aguarda NF' : ''}${r.ativo ? '' : ' · inativa'}</div></td>
        <td class="small">${r.categorias?.nome || '—'}</td><td>${r.dia_vencimento}</td><td>${r.periodicidade}</td><td class="r num ${r.tipo === 'pagar' ? 'neg' : 'pos'}">${money(r.valor)}</td>
        <td class="r">${isFin() ? html`<button class="btn sm" data-ed="${r.id}">Editar</button>` : ''}</td></tr>`)}

// ----------------------------------------------------------- RELATÓRIOS ----
async function viewRelatorios(){
  const st = store.get('fin_filtro_dre') || { de: addMonths(monthKey(), -5), ate: monthKey(), por:'categoria', prev:false };
  const render = async () => {
    store.set('fin_filtro_dre', st);
    const rows = await q(sb.from('vw_resultado_categoria').select('*').gte('mes', firstDay(st.de)).lte('mes', firstDay(st.ate)).limit(20000));
    const meses = []; for (let m = st.de; m <= st.ate && meses.length < 24; m = addMonths(m, 1)) meses.push(firstDay(m));
    const v = r => Number(r.realizado || 0) + (st.prev ? Number(r.previsto || 0) : 0);
    const chave = r => st.por === 'categoria' ? r.categoria : r.centro_custo;
    const grupoDe = r => st.por === 'categoria' ? r.grupo : (r.tipo === 'receber' ? 'Receitas' : 'Despesas');
    const bloco = tipo => {
      const rs = rows.filter(r => r.tipo === tipo);
      const grupos = {};
      rs.forEach(r => { const g = grupoDe(r), k = chave(r); grupos[g] ??= {}; grupos[g][k] ??= {}; grupos[g][k][r.mes] = (grupos[g][k][r.mes] || 0) + v(r); });
      const totMes = m => rs.filter(r => r.mes === m).reduce((a,r) => a + v(r), 0);
      return { grupos, totMes };
    };
    const rec = bloco('receber'), desp = bloco('pagar');
    const linhaVals = obj => meses.map(m => html`<td class="r num small">${obj[m] ? money(obj[m]) : ''}</td>`);
    const total = obj => meses.reduce((a,m) => a + (obj[m] || 0), 0);
    const renderBloco = (b, nome, sinal) => html`<tr class="grp"><td>${nome}</td>${meses.map(m => html`<td class="r num">${money(b.totMes(m))}</td>`)}<td class="r num">${money(meses.reduce((a,m) => a + b.totMes(m), 0))}</td></tr>
      ${Object.entries(b.grupos).sort((a,b2) => a[0].localeCompare(b2[0])).map(([g, itens]) => html`
        ${st.por === 'categoria' ? html`<tr><td style="padding-left:16px;font-weight:500">${g}</td>${meses.map(m => html`<td class="r num small">${money(Object.values(itens).reduce((a,o) => a + (o[m] || 0), 0))}</td>`)}<td class="r num small">${money(Object.values(itens).reduce((a,o) => a + total(o), 0))}</td></tr>` : ''}
        ${Object.entries(itens).sort((a,b2) => total(b2[1]) - total(a[1])).map(([k, o]) => html`<tr><td class="small muted" style="padding-left:${st.por === 'categoria' ? 32 : 16}px">${k}</td>${linhaVals(o)}<td class="r num small">${money(total(o))}</td></tr>`)}`)}`;
    const res = m => rec.totMes(m) - desp.totMes(m);
    view().innerHTML = html`<div class="head"><div><h1>Relatórios</h1><p>DRE gerencial por competência. Transferências e aportes ficam fora.</p></div>
      <div class="row"><input type="month" id="rde" value="${st.de}"> até <input type="month" id="rate" value="${st.ate}">
        <select id="rpor"><option value="categoria"${st.por === 'categoria' ? raw(' selected') : ''}>Por categoria</option><option value="centro"${st.por === 'centro' ? raw(' selected') : ''}>Por centro de custo</option></select>
        <label class="row small"><input type="checkbox" id="rprev"${st.prev ? raw(' checked') : ''}> incluir previsto</label>
        <button class="btn" id="rcsv">Baixar CSV</button></div></div>
      <div class="card"><div class="tbl-wrap"><table class="dre"><thead><tr><th></th>${meses.map(m => html`<th class="r">${brMonth(m)}</th>`)}<th class="r">Total</th></tr></thead><tbody>
        ${renderBloco(rec, 'Receitas', 1)}${renderBloco(desp, 'Despesas', -1)}
        <tr class="tot"><td>Resultado</td>${meses.map(m => html`<td class="r num ${res(m) < 0 ? 'neg' : 'pos'}">${money(res(m))}</td>`)}<td class="r num">${money(meses.reduce((a,m) => a + res(m), 0))}</td></tr>
      </tbody></table></div></div>`.s;
    $('#rde').onchange = e => { st.de = e.target.value; render(); };
    $('#rate').onchange = e => { st.ate = e.target.value; render(); };
    $('#rpor').onchange = e => { st.por = e.target.value; render(); };
    $('#rprev').onchange = e => { st.prev = e.target.checked; render(); };
    $('#rcsv').onclick = () => {
      const linhas = [['Tipo','Grupo', st.por === 'categoria' ? 'Categoria' : 'Centro de custo', ...meses.map(brMonth), 'Total']];
      [['Receitas', rec], ['Despesas', desp]].forEach(([t, b]) => Object.entries(b.grupos).forEach(([g, itens]) => Object.entries(itens).forEach(([k, o]) => linhas.push([t, g, k, ...meses.map(m => (o[m] || 0).toFixed(2).replace('.',',')), total(o).toFixed(2).replace('.',',')]))));
      baixar(`dre-${st.de}-a-${st.ate}.csv`, linhas.map(l => l.map(csvCell).join(';')).join('\r\n'));
    };
  };
  await render();
}

// CSV no mesmo formato do export do Granatum: ; como separador, vírgula decimal,
// data dd/mm/aaaa, valor negativo para saída e codificação Windows-1252
// (é o que o Granatum/Excel em português esperam — UTF-8 vira "ProfissionÃ£o").
const CP1252 = {'€':0x80,'‚':0x82,'ƒ':0x83,'„':0x84,'…':0x85,'†':0x86,'‡':0x87,'ˆ':0x88,'‰':0x89,'Š':0x8A,'‹':0x8B,'Œ':0x8C,'Ž':0x8E,'‘':0x91,'’':0x92,'“':0x93,'”':0x94,'•':0x95,'–':0x96,'—':0x97,'˜':0x98,'™':0x99,'š':0x9A,'›':0x9B,'œ':0x9C,'ž':0x9E,'Ÿ':0x9F};
const toCp1252 = s => Uint8Array.from([...s], c => { const n = c.charCodeAt(0); return n < 128 || (n >= 160 && n < 256) ? n : (CP1252[c] ?? 63); });
const csvCell = v => { v = v == null ? '' : String(v); return /[;"\r\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
function baixar(nome, texto, cp=true){
  const blob = new Blob([cp ? toCp1252(texto) : texto], { type:'text/csv;charset=' + (cp ? 'windows-1252' : 'utf-8') });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function viewExportar(){
  view().innerHTML = html`<div class="head"><div><h1>Exportar planilha</h1><p>CSV dos lançamentos pagos no período, nas mesmas colunas que vocês usavam no Granatum. Serve para o contador ou como cópia de segurança.</p></div></div>
    <div class="card pad" style="max-width:640px"><div class="row" style="margin-bottom:12px"><label class="small muted">Pagos entre</label><input type="date" id="ede" value="${firstDay(monthKey())}"><label class="small muted">e</label><input type="date" id="eate" value="${today()}"></div>

    const head = ['Descrição','Valor','Categoria','Forma de pagamento','Data de pagamento','Cliente/Fornecedor','Centro de custo/lucro','Custo nível de produção','Conta','Tags','Periodicidade','Parcelas'];
    const linhas = rows.map(l => [l.descricao, (l.tipo === 'pagar' ? -1 : 1) * Number(l.valor), l.categoria, '', brDate(l.data_pagamento), l.fornecedor, l.centro_custo,

      .map((v, i) => i === 1 ? String(v.toFixed(2)).replace('.',',').replace(/,00$/,'') : v));
    const semCat = rows.filter(r => !r.categoria).length;
    baixar(`lancamentos-${modo === 'receber' ? 'recebimentos-' : ''}${$('#ede').value}-a-${$('#eate').value}.csv`, [head, ...linhas].map(l => l.map(csvCell).join(';')).join('\r\n'));
    $('#eres').textContent = `${rows.length} linhas exportadas.` + (semCat ? ` ${semCat} sem categoria — revise antes de importar.` : '');
  };
  $('#exp').onclick = () => gerar('tudo').catch(e => toast(errMsg(e), true));
  $('#expr').onclick = () => gerar('receber').catch(e => toast(errMsg(e), true));
}
