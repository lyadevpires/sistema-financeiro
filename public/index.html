const XLSX_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const PDFJS_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function loadScript(src){
  if (document.querySelector(`script[src="${src}"]`)) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Não consegui carregar a biblioteca de leitura de arquivos. Verifique a internet e tente de novo.')); document.head.appendChild(s); });
}
async function lerPDF(file, ano){
  await loadScript(PDFJS_SRC);
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const linhas = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const tc = await (await pdf.getPage(p)).getTextContent();
    const porY = new Map();
    tc.items.forEach(it => { const y = Math.round(it.transform[5] / 2) * 2; if (!porY.has(y)) porY.set(y, []); porY.get(y).push(it); });
    [...porY.entries()].sort((a, b) => b[0] - a[0]).forEach(([, its]) => linhas.push(its.sort((a, b) => a.transform[4] - b.transform[4]).map(i => i.str).join(' ').replace(/\s+/g, ' ').trim()));
  }
  const NUM = String.raw`-?\s?(?:R\$\s?)?\d{1,3}(?:\.\d{3})*,\d{2}\s?-?(?:\s?[DC])?`;
  const re = new RegExp(String.raw`^(\d{1,2}[\/.]\d{1,2}(?:[\/.]\d{2,4})?|\d{1,2}\s?(?:de\s)?[A-Za-zç]{3})\s+(.+?)\s+(${NUM})(?:\s+(${NUM}))?$`, 'i');
  const out = [];
  for (const l of linhas) {
    const m = l.match(re); if (!m) continue;
    const data = parseData(m[1], ano); const desc = m[2].trim();
    if (!data || PULAR.test(semAcento(desc))) continue;
    const valor = parseNum(m[3]); if (!valor || isNaN(valor)) continue;
    out.push({ data, descricao: desc, documento: null, valor, saldo: m[4] ? parseNum(m[4]) : null });
  }
  return { linhas: out, avisos: ['PDF lido pelo texto da página. Confira valores e sinais na prévia antes de importar — CSV/Excel é mais confiável.'] };
}
async function lerArquivo(file, ano){
  const nome = file.name.toLowerCase();
  if (nome.endsWith('.pdf')) return lerPDF(file, ano);
  if (/\.(csv|txt)$/.test(nome)) {
    const buf = await file.arrayBuffer(); let text;
    try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch { text = new TextDecoder('windows-1252').decode(buf); }
    return tabelaParaExtrato(parseCSV(text.replace(/^﻿/, '')), ano);
  }
  await loadScript(XLSX_SRC);
  const wb = window.XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
  let melhor = { linhas: [], avisos: [] };
  for (const nomeAba of wb.SheetNames) {
    const r = tabelaParaExtrato(window.XLSX.utils.sheet_to_json(wb.Sheets[nomeAba], { header: 1, raw: true, defval: '' }), ano);
    if (r.linhas.length > melhor.linhas.length) melhor = r;
  }
  return melhor;
}

// Modal de importação (extrato de conta ou fatura de cartão)
function modalImportar({ titulo, contaOpts, contaInicial, modoCartao=false, extraCampos='', onImport }){
  return new Promise(resolve => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = html`<div class="modal" style="width:min(900px,100%)"><header><h2>${titulo}</h2><button class="btn sm" data-x>Fechar</button></header>
      <div class="body" style="grid-template-columns:1fr 1fr 1fr">
        <div class="f"><label for="imp_conta">${modoCartao ? 'Cartão' : 'Conta'}</label><select id="imp_conta">${contaOpts.map(o => html`<option value="${o.value}"${o.value === contaInicial ? raw(' selected') : ''}>${o.label}</option>`)}</select></div>
        ${raw(extraCampos)}
        <div class="f"><label for="imp_ano">Ano (para datas sem ano)</label><input id="imp_ano" type="number" value="${new Date().getFullYear()}"></div>
        <div class="f full"><label for="imp_arq">Arquivo do banco</label><input id="imp_arq" type="file" accept=".csv,.txt,.xls,.xlsx,.pdf"><span class="hint">CSV ou Excel exportado do internet banking (mais confiável) ou PDF.</span></div>
        <div class="f full" id="imp_prev"></div>
      </div>
      <footer><button class="btn" data-x>Cancelar</button><button class="btn pri" id="imp_ok" disabled>Importar</button></footer></div>`.s;
    document.body.appendChild(bg);
    let lidas = [], sinal = 1;
    const close = r => { bg.remove(); resolve(r); };
    $$('[data-x]', bg).forEach(b => b.onclick = () => close(null));
    const prev = $('#imp_prev', bg), ok = $('#imp_ok', bg);
    const render = (avisos=[]) => {
      if (!lidas.length) { prev.innerHTML = html`<div class="note neg">Não encontrei lançamentos nesse arquivo. Se for PDF, tente o CSV/Excel do mesmo período.</div>`.s; ok.disabled = true; return; }
      const sel = lidas.filter(l => l.ok);
      const ent = sel.filter(l => l.valor * sinal > 0).reduce((a, l) => a + l.valor * sinal, 0), sai = sel.filter(l => l.valor * sinal < 0).reduce((a, l) => a + l.valor * sinal, 0);
      const datas = lidas.map(l => l.data).sort();
      prev.innerHTML = html`${avisos.map(a => html`<div class="note" style="margin-bottom:8px">${a}</div>`)}
        <div class="row small" style="justify-content:space-between;margin-bottom:6px"><span><b>${sel.length}</b> de ${lidas.length} linhas · ${brDate(datas[0])} a ${brDate(datas.at(-1))} · ${modoCartao ? html`compras <b class="neg">${money(Math.abs(sai))}</b> · estornos <b class="pos">${money(ent)}</b>` : html`entradas <b class="pos">${money(ent)}</b> · saídas <b class="neg">${money(Math.abs(sai))}</b>`}</span>
        <button class="btn sm" id="imp_sinal" type="button">Inverter sinais</button></div>
        <div class="tbl-wrap" style="max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px"><table><thead><tr><th><input type="checkbox" id="imp_all" checked></th><th>Data</th><th>Descrição</th><th class="r">Valor</th>${lidas.some(l => l.saldo != null) ? html`<th class="r">Saldo</th>` : ''}</tr></thead><tbody>
        ${lidas.map((l, i) => html`<tr><td><input type="checkbox" data-i="${i}"${l.ok ? raw(' checked') : ''}></td><td class="num">${brDate(l.data)}</td><td>${l.descricao}</td><td class="r num ${l.valor * sinal < 0 ? 'neg' : 'pos'}">${money(l.valor * sinal)}</td>${lidas.some(x => x.saldo != null) ? html`<td class="r num muted">${l.saldo == null ? '' : money(l.saldo)}</td>` : ''}</tr>`)}
        </tbody></table></div>
        <div class="small muted" style="margin-top:6px">${modoCartao ? 'Compras aparecem em vermelho. Se estiverem verdes, use “Inverter sinais”.' : 'Saídas aparecem em vermelho. Se o banco exportou ao contrário, use “Inverter sinais”.'} Linhas já importadas antes são ignoradas automaticamente.</div>`.s;
      $$('[data-i]', prev).forEach(c => c.onchange = () => { lidas[+c.dataset.i].ok = c.checked; render(avisos); });
      $('#imp_all', prev).onchange = e => { lidas.forEach(l => l.ok = e.target.checked); render(avisos); };
      $('#imp_sinal', prev).onclick = () => { sinal *= -1; render(avisos); };
      ok.disabled = !sel.length; ok.textContent = `Importar ${sel.length} linha(s)`;
    };
    $('#imp_arq', bg).onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      prev.innerHTML = html`<div class="muted">Lendo ${f.name}…</div>`.s; ok.disabled = true;
      try { const r = await lerArquivo(f, +$('#imp_ano', bg).value); lidas = r.linhas.map(l => ({ ...l, ok: true })); sinal = 1;
        if (modoCartao && lidas.length && lidas.filter(l => l.valor > 0).length > lidas.length / 2) sinal = -1; // fatura costuma vir com compras positivas
        render(r.avisos); }
      catch(err) { prev.innerHTML = html`<div class="note neg">${errMsg(err)}</div>`.s; }
    };
    ok.onclick = async () => {
      ok.disabled = true; ok.textContent = 'Importando…';
      try {
        const arq = $('#imp_arq', bg).files[0];
        const linhas = lidas.filter(l => l.ok).map(l => ({ ...l, valor: Math.round(l.valor * sinal * 100) / 100 }));
        const r = await onImport({ conta: $('#imp_conta', bg).value, linhas, arquivo: arq?.name, formato: arq?.name.split('.').pop(), bg });
        close(r ?? true);
      } catch(err) { toast(errMsg(err), true); ok.disabled = false; ok.textContent = 'Importar'; }
    };
  });
}

  const padrao = l.descricao.replace(/\d{2}\/\d{2}(\/\d{2,4})?/g, '').replace(/\b\d{3,}\b/g, '').replace(/\s+/g, ' ').trim().split(' ').slice(0, 3).join(' ');
  const ok = await formModal({ title: tipo === 'pagar' ? 'Nova saída a partir do extrato' : 'Nova entrada a partir do extrato',
    note: `${brDate(l.data)} · ${l.descricao} · ${money(l.valor)}${s ? ` — classificação sugerida ${s.origem === 'regra' ? 'pela regra cadastrada' : s.origem === 'fornecedor' ? 'pelo nome do fornecedor no texto' : 'pelo histórico'}` : ''}`,
    initial: { descricao: s?.descricao || l.descricao, categoria_id: s?.categoria_id, centro_custo_id: s?.centro_custo_id, fornecedor_id: s?.fornecedor_id, projeto_id: s?.projeto_id, data_competencia: firstDay(l.data.slice(0,7)), regra: s?.origem === 'regra' ? '' : padrao },
    fields: [
      { key:'descricao', label:'Descrição', required:true, full:true },
      { key:'categoria_id', label:'Categoria', type:'select', required:true, options:() => opts(S.lk.categorias, catFilter) },
      { key:'centro_custo_id', label:'Centro de custo', type:'select', options:() => opts(S.lk.centros) },
      { key:'fornecedor_id', label: tipo === 'pagar' ? 'Fornecedor / pessoa' : 'Cliente', type:'select', options:() => opts(S.lk.fornecedores) },
      { key:'data_competencia', label:'Competência', type:'month', required:true },
      { key:'projeto_id', label:'Projeto', type:'select', options:() => opts(S.lk.projetos) },
      { key:'custo_nivel', label:'Nível de custo', type:'select', options:[{value:'fixo',label:'Fixo'},{value:'variavel',label:'Variável'}] },
      { key:'regra', label:'Lembrar para as próximas vezes quando o extrato contiver…', full:true, hint:'Deixe em branco para não criar regra. Ex.: TAR PACOTE, IOF, HOTMART.' },
    ], saveLabel:'Criar e conciliar',
    onSave: async d => { const { regra, ...dados } = d; await q(sb.rpc('conciliar_novo', { p_linha:l.id, p_dados:dados, p_regra: regra || null })); if (regra) await loadLookups(); } });
  if (ok) { toast('Lançamento criado e conciliado.'); depois(); }
}

async function buscarParaLinha(l, sugs, depois){
  const tipo = l.valor < 0 ? 'pagar' : 'receber', alvo = Math.abs(l.valor);
  const bg = document.createElement('div'); bg.className = 'modal-bg'; document.body.appendChild(bg);
  const sel = new Map(); let lista = sugs.map(s => ({ ...s, _fatura: s.tipo === 'fatura' }));
  const close = () => bg.remove();
  const render = () => {
    const soma = [...sel.values()].reduce((a, x) => a + Number(x.valor), 0);
    const temFatura = [...sel.values()].some(x => x._fatura);
    bg.innerHTML = html`<div class="modal" style="width:min(820px,100%)"><header><div><h2>Conciliar linha do extrato</h2><div class="small muted">${brDate(l.data)} · ${l.descricao} · <b class="${l.valor < 0 ? 'neg' : 'pos'}">${money(l.valor)}</b></div></div><button class="btn sm" data-x>Fechar</button></header>
      <div class="body" style="grid-template-columns:1fr">
        <div class="row"><input id="bq" class="grow" placeholder="Buscar por descrição, fornecedor ou valor (ex.: 9500)"><button class="btn" id="bgo">Buscar</button></div>
        <div class="tbl-wrap" style="max-height:360px;overflow:auto"><table><thead><tr><th></th><th>Lançamento</th><th>Data</th><th class="r">Valor</th></tr></thead><tbody>
          ${lista.length ? lista.map((x, i) => html`<tr><td><input type="checkbox" data-s="${i}"${sel.has(x.id) ? raw(' checked') : ''}></td><td><div>${x.descricao}</div><div class="small muted">${x._fatura ? 'fatura de cartão' : (x.fornecedor || '')}${x.situacao ? ' · ' + x.situacao : ''}</div></td><td class="num">${brDate(x.data)}</td><td class="r num">${money(x.valor)}</td></tr>`) : html`<tr><td colspan="4" class="empty">Nenhum candidato. Busque acima ou crie um lançamento.</td></tr>`}
        </tbody></table></div>
        <div class="note ${sel.size && Math.abs(soma - alvo) >= 0.01 && (sel.size > 1) ? 'neg' : 'info'}">${sel.size ? `Selecionado: ${money(soma)} de ${money(alvo)}` : 'Marque um lançamento, ou vários que somem o valor da linha (ex.: PIX em lote).'}${sel.size === 1 && Math.abs(soma - alvo) >= 0.01 && !temFatura ? ' — com um lançamento só, o valor dele passa a ser o do extrato.' : ''}</div>
      </div>
      <footer><button class="btn" data-x>Cancelar</button><button class="btn pri" id="bok"${sel.size && !(sel.size > 1 && Math.abs(soma - alvo) >= 0.01) && !(temFatura && sel.size > 1) ? '' : raw(' disabled')}>Conciliar</button></footer></div>`.s;
    $$('[data-x]', bg).forEach(b => b.onclick = close);
    $$('[data-s]', bg).forEach(c => c.onchange = () => { const x = lista[+c.dataset.s]; c.checked ? sel.set(x.id, x) : sel.delete(x.id); render(); });
    const buscar = async () => {
      const t = $('#bq', bg).value.trim(); if (!t) return;
      let qb = sb.from('vw_lancamentos').select('id,descricao,valor,data_vencimento,data_pagamento,fornecedor,situacao').eq('tipo', tipo).is('extrato_linha_id', null).is('fatura_id', null).neq('status', 'cancelado');
      const n = parseMoney(t);
      qb = !isNaN(n) && /^[\d.,\sR$]+$/.test(t) ? qb.eq('valor', n) : qb.or(`descricao.ilike.*${t.replace(/[*,()]/g,' ')}*,fornecedor.ilike.*${t.replace(/[*,()]/g,' ')}*`);
      const r = await q(qb.order('data_vencimento', { ascending:false }).limit(40));
      lista = [...[...sel.values()], ...r.filter(x => !sel.has(x.id)).map(x => ({ ...x, data: x.data_pagamento || x.data_vencimento }))];
      render(); $('#bq', bg).value = t;
    };
    $('#bgo', bg).onclick = buscar; $('#bq', bg).onkeydown = e => { if (e.key === 'Enter') buscar(); };
    $('#bok', bg).onclick = async () => {
      const xs = [...sel.values()];
      try {
        if (xs[0]._fatura) await q(sb.rpc('conciliar_fatura', { p_linha:l.id, p_fatura:xs[0].id }));
        else await q(sb.rpc('conciliar', { p_linha:l.id, p_lancamentos: xs.map(x => x.id) }));
        close(); toast('Conciliado.'); depois();
      } catch(e) { toast(errMsg(e), true); }
    };
  };
  bg.addEventListener('mousedown', e => { if (e.target === bg) close(); });
  render();
}

// -------------------------------------------------------------- CARTÕES ----
const pillFatura = f => { const s = f.status === 'paga' ? 'paga' : f.data_fechamento < today() ? 'fechada' : 'aberta';
  return html`<span class="pill p-${{ paga:'paga', fechada:'aprovada', aberta:'enviada' }[s]}">${s}</span>`; };
async function viewCartoes(){
  const cs = cartoes().filter(c => c.ativo !== false);
  if (!cs.length) { view().innerHTML = html`<div class="head"><div><h1>Cartões de crédito</h1></div></div><div class="card pad"><p>Nenhum cartão cadastrado. Crie em <a href="#/cadastros">Cadastros → Contas e cartões</a> com tipo “Cartão de crédito”.</p></div>`.s; return; }
  const st = store.get('fin_cart') || {};
  const abertas = await q(sb.from('vw_faturas').select('cartao_id,total').neq('status','paga'));
  const emAberto = id => abertas.filter(f => f.cartao_id === id).reduce((a, f) => a + Number(f.total), 0);
  cs.sort((a, b) => emAberto(b.id) - emAberto(a.id) || a.nome.localeCompare(b.nome));
  if (!cs.some(c => c.id === st.cartao)) st.cartao = cs[0].id;
  const render = async () => {
    store.set('fin_cart', st);
    const todas = await q(sb.from('vw_faturas').select('*').order('mes_vencimento', { ascending:false }));
    const c = cs.find(x => x.id === st.cartao);
    const fats = todas.filter(f => f.cartao_id === st.cartao);
    if (!fats.some(f => f.id === st.fatura)) st.fatura = (fats.find(f => f.status !== 'paga' && f.mes_vencimento <= firstDay(addMonths(monthKey(), 1))) || fats[0])?.id;
    const fa = fats.find(f => f.id === st.fatura);
    const itens = fa ? await q(sb.from('vw_lancamentos').select('*').eq('fatura_id', fa.id).order('data_documento', { nullsFirst:false }).order('descricao')) : [];
    const aberto = id => todas.filter(f => f.cartao_id === id && f.status !== 'paga').reduce((a, f) => a + Number(f.total), 0);
    view().innerHTML = html`
      <div class="head"><div><h1>Cartões de crédito</h1><p>Cada compra é lançada com sua categoria. Quando a fatura é paga, todas as compras dela viram “pago” na data do pagamento.</p></div>
        ${isFin() ? html`<div class="row"><button class="btn" id="novaf">Abrir fatura de outro mês</button><button class="btn pri" id="impf">Importar fatura</button></div>` : ''}</div>
      <div class="tabs">${cs.map(x => html`<button data-c="${x.id}" class="${x.id === st.cartao ? 'on' : ''}">${x.nome}${aberto(x.id) ? html` <span class="small muted num">${money(aberto(x.id))}</span>` : ''}</button>`)}</div>
      <div class="grid2" style="grid-template-columns:260px 1fr">
        <div class="card"><div class="filters"><span class="small muted">${c.dia_fechamento ? `Fecha dia ${c.dia_fechamento} · vence dia ${c.dia_vencimento}` : html`<a href="#/cadastros">defina fechamento e vencimento</a>`}</span></div>
          ${fats.length ? fats.map(f => html`<div class="list-item" style="padding:10px 14px;cursor:pointer;${f.id === st.fatura ? 'background:var(--brand-soft)' : ''}" data-f="${f.id}">
            <div><b>${brMonth(f.mes_vencimento)}</b><div class="small muted">vence ${brDate(f.data_vencimento)}</div></div>
            <div style="text-align:right"><div class="num">${money(f.total)}</div>${pillFatura(f)}</div></div>`) : html`<div class="empty">Sem faturas ainda.</div>`}
        </div>
        <div class="card">${fa ? html`
          <div class="filters" style="align-items:center"><div class="grow"><h2>Fatura ${brMonth(fa.mes_vencimento)}</h2><div class="small muted">fecha ${brDate(fa.data_fechamento)} · vence ${brDate(fa.data_vencimento)} · ${fa.itens} compra(s)${fa.sem_categoria ? html` · <span class="neg">${fa.sem_categoria} sem categoria</span>` : ''}${fa.status === 'paga' ? ` · paga em ${brDate(fa.data_pagamento)} (${money(fa.valor_pago)})` : ''}${fa.conciliada ? ' · conciliada com o extrato' : ''}</div></div>
            <div class="num" style="font-size:20px">${money(fa.total)}</div></div>
          ${isFin() ? html`<div class="filters"><button class="btn sm" id="addc">+ Compra</button><button class="btn sm" id="anxf">Anexos${fa.qtd_anexos ? ` (${fa.qtd_anexos})` : ''}</button>
            ${fa.status === 'paga' ? (fa.conciliada ? '' : html`<button class="btn sm" id="reab">Reabrir fatura</button>`) : html`<button class="btn sm ok" id="pagf">Registrar pagamento</button>`}
            <span class="small muted grow" style="text-align:right">${fa.status === 'paga' ? '' : 'Ou importe o extrato da conta: o pagamento da fatura é reconhecido na conciliação.'}</span></div>` : ''}
          ${itens.length ? html`<div class="tbl-wrap"><table><thead><tr><th>Compra</th><th>Descrição</th><th>Categoria</th><th class="r">Valor</th><th></th></tr></thead><tbody>
            ${itens.map(l => html`<tr><td class="num">${l.data_documento ? brDate(l.data_documento) : html`<span class="small muted">recorrente</span>`}</td><td><div>${l.descricao}</div><div class="small muted">${l.fornecedor || ''}${l.centro_custo ? (l.fornecedor ? ' · ' : '') + l.centro_custo : ''}</div></td>
              <td class="small">${l.categoria || html`<span class="neg">sem categoria</span>`}</td><td class="r num ${l.tipo === 'receber' ? 'pos' : ''}">${l.tipo === 'receber' ? '−' : ''}${money(l.valor)}</td>
              <td class="r">${isFin() ? html`<button class="btn sm" data-ed="${l.id}">Editar</button>` : ''}</td></tr>`)}
          </tbody></table></div>` : html`<div class="empty">Nenhuma compra nesta fatura. Importe o arquivo da fatura ou lance as compras.</div>`}` : html`<div class="empty">Escolha uma fatura.</div>`}
        </div>
      </div>`.s;
    $$('[data-c]').forEach(b => b.onclick = () => { st.cartao = b.dataset.c; st.fatura = null; render(); });
    $$('[data-f]').forEach(b => b.onclick = () => { st.fatura = b.dataset.f; render(); });
    $$('[data-ed]').forEach(b => b.onclick = () => editarLanc(itens.find(x => x.id === b.dataset.ed).tipo, itens.find(x => x.id === b.dataset.ed), false, render));
    $('#addc')?.addEventListener('click', () => editarLanc('pagar', { status:'aprovado', conta_id: c.id, fatura_id: fa.id, data_documento: today(), data_competencia: firstDay(monthKey()), data_vencimento: fa.data_vencimento, tags:[] }, true, render));
    $('#anxf')?.addEventListener('click', () => modalAnexos({ faturaId: fa.id, titulo:`Anexos · fatura ${brMonth(fa.mes_vencimento)}` }).then(render));
    $('#pagf')?.addEventListener('click', async () => {
      const ok = await formModal({ title:`Pagar fatura ${brMonth(fa.mes_vencimento)}`, note:`Total das compras: ${money(fa.total)}. Se a fatura teve juros ou IOF, informe o valor efetivamente pago.`,
        initial:{ data: fa.data_vencimento, conta: c.conta_pagamento_id, valor: fa.total },
        fields:[{ key:'data', label:'Data do pagamento', type:'date', required:true }, { key:'conta', label:'Pago pela conta', type:'select', required:true, options:() => opts(contasCorrentes()) }, { key:'valor', label:'Valor pago', type:'money', required:true }],
        saveLabel:'Registrar pagamento', onSave: d => q(sb.rpc('pagar_fatura', { p_fatura:fa.id, p_data:d.data, p_conta:d.conta, p_valor:d.valor })) });
      if (ok) { toast('Fatura paga. As compras foram marcadas como pagas.'); render(); }
    });
    $('#reab')?.addEventListener('click', async () => { if (!await confirmar('Reabrir fatura', 'As compras voltam para “aprovado” e o pagamento é desfeito.')) return;
      try { await q(sb.rpc('reabrir_fatura', { p_fatura: fa.id })); toast('Fatura reaberta.'); render(); } catch(e) { toast(errMsg(e), true); } });
    $('#novaf')?.addEventListener('click', async () => {
      const r = await formModal({ title:'Abrir fatura', fields:[{ key:'mes', label:'Mês de vencimento', type:'month', required:true }], initial:{ mes: firstDay(addMonths(monthKey(), 1)) }, saveLabel:'Abrir',
        onSave: d => q(sb.rpc('obter_fatura', { p_cartao: st.cartao, p_mes: d.mes })) });
      if (r) { st.fatura = r; render(); }
    });
    $('#impf')?.addEventListener('click', () => importarFatura(cs, st, render));
  };
  await render();
}

async function importarFatura(cs, st, depois){
  const r = await modalImportar({ titulo:'Importar fatura do cartão', modoCartao:true, contaOpts: cs.map(c => ({ value:c.id, label:c.nome })), contaInicial: st.cartao,
    extraCampos: html`<div class="f"><label for="imp_mes">Fatura com vencimento em</label><input id="imp_mes" type="month" value="${st.fatura ? '' : monthKey()}"></div>`.s,
    onImport: async ({ conta, linhas, bg }) => {
      const mes = $('#imp_mes', bg).value; if (!mes) throw new Error('Informe o mês de vencimento da fatura.');
      const fid = await q(sb.rpc('obter_fatura', { p_cartao: conta, p_mes: firstDay(mes) }));
      const existentes = await q(sb.from('lancamentos').select('data_documento,valor,descricao').eq('fatura_id', fid));
      const chave = x => `${x.data_documento}|${Number(x.valor).toFixed(2)}|${semAcento(x.descricao)}`;
      const ja = new Set(existentes.map(chave));
      const novos = linhas.map(l => ({ l, tipo: l.valor < 0 ? 'pagar' : 'receber', data_documento: l.data, valor: Math.abs(l.valor), descricao: l.descricao })).filter(x => !ja.has(chave(x)));
      // classificação: regra → fornecedor → histórico, em paralelo de 8 em 8
      const cls = [];
      for (let i = 0; i < novos.length; i += 8) cls.push(...await Promise.all(novos.slice(i, i + 8).map(x => q(sb.rpc('sugerir_classificacao', { p_texto: x.descricao, p_tipo: 'pagar' })).then(r => r[0]).catch(() => null))));
      const rows = novos.map((x, i) => ({ tipo: x.tipo, descricao: x.descricao, valor: x.valor, data_documento: x.data_documento, data_competencia: firstDay(x.data_documento.slice(0,7)),
        data_vencimento: x.data_documento, status:'aprovado', conta_id: conta, fatura_id: fid, forma_pagamento:'cartao_credito', origem:'importacao',
        categoria_id: x.tipo === 'pagar' ? cls[i]?.categoria_id || null : null, centro_custo_id: cls[i]?.centro_custo_id || null, fornecedor_id: cls[i]?.fornecedor_id || null }));
      for (let i = 0; i < rows.length; i += 300) await q(sb.from('lancamentos').insert(rows.slice(i, i + 300)));
      return { fid, conta, novos: rows.length, rep: linhas.length - rows.length, semCat: rows.filter(r => r.tipo === 'pagar' && !r.categoria_id).length };
    } });
  if (r) { st.cartao = r.conta; st.fatura = r.fid; toast(`${r.novos} compra(s) importada(s)${r.rep ? `, ${r.rep} já existiam` : ''}.${r.semCat ? ` ${r.semCat} ficaram sem categoria — classifique na lista.` : ''}`); depois(); }
}

if (DEMO || cfg?.url) boot(); else renderConfig();
