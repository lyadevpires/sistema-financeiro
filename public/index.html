<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* entradas = azul (--pos), saídas = vermelho (--neg), marca = violeta, sucesso = verde (--ok) */
  --bg:#F4F5FB; --surface:#FFFFFF; --surface-2:#EEF0F8; --ink:#141527; --ink-2:#44476A; --ink-3:#74789C;
  --line:#E1E3EF; --brand:#6D28D9; --brand-ink:#FFFFFF; --brand-soft:#EDE4FF;
  --pos:#1463F3; --pos-soft:#E1EBFF; --neg:#E11D48; --neg-soft:#FFE1E7; --ok:#0E9F6E; --ok-soft:#DCF7EC;
  --warn:#D97706; --warn-soft:#FEF0D7; --info:#6D28D9; --info-soft:#EDE4FF;
  --side:#1B1340; --side-2:#2A1F5C; --side-ink:#F1EEFF; --side-ink-2:#A89FD8;
  --shadow:0 1px 2px rgba(20,21,39,.05),0 8px 24px rgba(20,21,39,.06);
  --r:10px; --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1020; --surface:#181A2E; --surface-2:#20233B; --ink:#EEF0FF; --ink-2:#B7BBDD; --ink-3:#8488AC;
  --line:#2C2F4A; --brand:#A78BFA; --brand-ink:#140A33; --brand-soft:#2B2050;
  --pos:#5B9BFF; --pos-soft:#16264A; --neg:#FF5C7A; --neg-soft:#401622; --ok:#34D399; --ok-soft:#10332A;
  --warn:#FBBF24; --warn-soft:#3A2B0B; --info:#A78BFA; --info-soft:#2B2050;
  --side:#0B0B18; --side-2:#1E1A3A; --side-ink:#EEF0FF; --side-ink-2:#8F89BF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1020; --surface:#181A2E; --surface-2:#20233B; --ink:#EEF0FF; --ink-2:#B7BBDD; --ink-3:#8488AC;
  --line:#2C2F4A; --brand:#A78BFA; --brand-ink:#140A33; --brand-soft:#2B2050;
  --pos:#5B9BFF; --pos-soft:#16264A; --neg:#FF5C7A; --neg-soft:#401622; --ok:#34D399; --ok-soft:#10332A;
  --warn:#FBBF24; --warn-soft:#3A2B0B; --info:#A78BFA; --info-soft:#2B2050;
  --side:#0B0B18; --side-2:#1E1A3A; --side-ink:#EEF0FF; --side-ink-2:#8F89BF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:28px} h2{font-size:19px} h3{font-size:15px;font-family:var(--sans)}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--ink-3)} .small{font-size:12px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .ok{color:var(--ok)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);border-right:0;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.brand{font-family:var(--serif);font-size:20px;padding:0 10px 18px}
.brand{color:var(--side-ink)} .brand small{display:block;font-family:var(--sans);font-size:11px;color:var(--side-ink-2);letter-spacing:.06em;text-transform:uppercase}
.nav-sec{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--side-ink-2);padding:14px 10px 4px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--side-ink);opacity:.86}
.nav a:hover{background:var(--side-2);opacity:1} .nav a.on{background:var(--brand);color:#fff;opacity:1;font-weight:500}
.badge{background:#FF7A1A;color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:600}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--side-2);font-size:12px;color:var(--side-ink-2)} .side-foot .muted{color:var(--side-ink-2)} .side-foot .linkbtn{color:var(--side-ink)}
.main{padding:28px 32px 60px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head p{margin:4px 0 0;color:var(--ink-3)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card.pad{padding:18px 20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:16px 18px}
.kpi .l{font-size:12px;color:var(--ink-3)} .kpi .v{font-family:var(--mono);font-size:clamp(16px,1.6vw,21px);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.btn{text-decoration:none;display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)} .btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--neg)} .btn.ok{color:var(--ok);border-color:var(--ok-soft)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;color:var(--brand);cursor:pointer;padding:0;text-decoration:underline}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
textarea{min-height:70px;resize:vertical;width:100%}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--brand);font-weight:500}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;font-size:12px;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
tfoot td{font-weight:600;border-top:1px solid var(--line)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-previsto{background:var(--surface-2);color:var(--ink-2)} .p-aprovado{background:var(--brand-soft);color:var(--brand)}
.p-pago,.p-paga{background:var(--ok-soft);color:var(--ok)} .p-atrasado,.p-rejeitada{background:var(--neg-soft);color:var(--neg)}
.p-cancelado{background:var(--surface-2);color:var(--ink-3);text-decoration:line-through}
.p-enviada{background:var(--warn-soft);color:var(--warn)} .p-aprovada{background:var(--brand-soft);color:var(--brand)}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--line)}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.empty{padding:36px;text-align:center;color:var(--ink-3)}
.modal-bg{position:fixed;inset:0;background:rgba(15,22,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:14px;width:min(640px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .body{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.modal footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.f{display:flex;flex-direction:column;gap:4px} .f.full{grid-column:1/-1}
.f label{font-size:12px;color:var(--ink-2);font-weight:500} .f .hint{font-size:11px;color:var(--ink-3)}
.f input,.f select{width:100%}
.chk{flex-direction:row;align-items:center;gap:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;box-shadow:var(--shadow);max-width:90vw}
.toast.err{background:var(--neg);color:#fff}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--brand)} .bar > i.over{background:var(--neg)}
.list-item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.note{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13px}
.note.info{background:var(--info-soft)} .note.neg{background:var(--neg-soft)}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth .card{width:min(400px,100%);padding:28px}
.auth form{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.auth input{width:100%}
.steps{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.steps span.on{color:var(--ink);font-weight:600}
.dre td:first-child{white-space:nowrap} .dre tr.grp td{background:var(--surface-2);font-weight:600}
.dre tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.portal{max-width:880px;margin:0 auto;padding:28px 16px 60px}
.nf-item{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.nf-item:last-child{border-bottom:0}
.menu-btn{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  .main{padding:18px 16px 60px}
  .grid2{grid-template-columns:1fr}
  .modal .body{grid-template-columns:1fr}
  h1{font-size:23px}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="/config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { semAcento, parseNum, parseData, parseCSV, PULAR, tabelaParaExtrato, chavesExtrato } from './js/extrato-parser.js';

// ============================================================================
// CONFIGURAÇÃO — vem de /config.js, gerado no build a partir das variáveis de
// ambiente SUPABASE_URL e SUPABASE_ANON_KEY (scripts/gerar-config.mjs).
// A anon key é pública por natureza: quem protege os dados é o RLS.
// Sem config.js (rodando local sem build), a tela pede os dados.
// ============================================================================
const CONFIG = window.__FIN_CONFIG || { url: '', anonKey: '' };

// ----------------------------------------------------------------------------
// utilidades
// ----------------------------------------------------------------------------
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} },
};
class Raw { constructor(s){ this.s = s; } }
const raw = s => new Raw(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = v => v instanceof Raw ? v.s : Array.isArray(v) ? v.map(val).join('') : (v == null || v === false) ? '' : esc(v);
// html`...` escapa tudo que é interpolado. Texto digitado por PJs externos
// (descrição da NF, nome do arquivo) nunca vira HTML executável aqui dentro.
function html(strings, ...vals){ let o = ''; strings.forEach((s,i) => { o += s; if (i < vals.length) o += val(vals[i]); }); return raw(o); }
const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => [...el.querySelectorAll(sel)];

const BRL = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' });
const money = v => v == null || v === '' ? '—' : BRL.format(Number(v));
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const monthKey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const addMonths = (ym, n) => { const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return monthKey(d); };
const firstDay = ym => `${ym}-01`;
const lastDay = ym => { const [y,m] = ym.split('-').map(Number); return iso(new Date(y, m, 0)); };
const brDate = s => s ? s.slice(0,10).split('-').reverse().join('/') : '—';
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const brMonth = s => { if(!s) return '—'; const [y,m] = s.slice(0,7).split('-'); return `${MESES[+m-1]}/${y.slice(2)}`; };
const parseMoney = s => { if (s == null) return null; s = String(s).trim().replace(/[R$\s]/g,''); if (!s) return null; if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); const n = Number(s); return isNaN(n) ? NaN : n; };
const moneyInput = v => v == null || v === '' ? '' : Number(v).toFixed(2).replace('.',',');

function toast(msg, err=false){
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 3000);
}
function errMsg(e){
  const m = e?.message || String(e);
  if (/duplicate key.*nf_numero_uk/.test(m)) return 'Já existe uma nota com esse número para este fornecedor.';
  if (/duplicate key.*fornecedores_email_uk/.test(m)) return 'Esse e-mail já está em outro cadastro.';
  if (/duplicate key/.test(m)) return 'Já existe um registro com esses dados.';
  if (/row-level security/.test(m)) return 'Seu perfil não tem permissão para isso.';
  if (/Invalid login credentials/.test(m)) return 'E-mail ou senha incorretos.';
  if (/Email not confirmed/.test(m)) return 'Confirme seu e-mail pelo link que enviamos antes de entrar.';
  return m;
}
async function q(promise){ const { data, error, count } = await promise; if (error) throw error; return count != null ? { data, count } : data; }

// ----------------------------------------------------------------------------
// conexão
// ----------------------------------------------------------------------------
const cfg = CONFIG.url ? CONFIG : store.get('fin_cfg');
const root = $('#root');

function renderConfig(){
  root.innerHTML = html`<div class="auth"><div class="card">
    <h1>Conectar ao Supabase</h1>
    <p class="muted">Cole a URL e a anon key do projeto (Project Settings → API). Para publicar para a equipe e PJs, preencha a constante CONFIG no topo do arquivo em vez de usar esta tela.</p>
    <form id="cf"><input name="url" placeholder="https://xxxx.supabase.co" required>
    <input name="key" placeholder="anon key (eyJ...)" required>
    <button class="btn pri">Salvar e continuar</button></form></div></div>`.s;
  $('#cf').onsubmit = e => { e.preventDefault(); const f = new FormData(e.target);
    store.set('fin_cfg', { url: f.get('url').trim(), anonKey: f.get('key').trim() }); location.reload(); };
}

let sb;
const S = { session:null, perfil:null, fornecedor:null, params:null, lk:{}, recovery:false };
const isFin = () => ['admin','financeiro'].includes(S.perfil?.papel);
const isAdmin = () => S.perfil?.papel === 'admin';
const isInterno = () => ['admin','financeiro','leitura'].includes(S.perfil?.papel);

async function boot(){
  sb = createClient(cfg.url, cfg.anonKey);
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'PASSWORD_RECOVERY') { S.recovery = true; renderAuth('nova-senha'); return; }
    if (ev === 'SIGNED_OUT') { S.session = null; S.perfil = null; renderAuth('entrar'); }
  });
  const { data } = await sb.auth.getSession();
  if (data.session && !location.hash.includes('type=recovery')) await afterLogin(data.session);
  else if (!location.hash.includes('type=recovery')) renderAuth('entrar');
}

async function afterLogin(session){
  S.session = session;
  try {
    S.perfil = (await q(sb.from('perfis').select('*').eq('id', session.user.id).maybeSingle()));
    S.params = (await q(sb.from('parametros').select('*').maybeSingle())) || {};
    if (!S.perfil) throw new Error('Perfil não encontrado. O 01-schema.sql foi executado?');
    if (isInterno()) { await loadLookups(); window.onhashchange = route; route(); }
    else { S.fornecedor = S.perfil.fornecedor_id ? await q(sb.from('fornecedores').select('*').eq('id', S.perfil.fornecedor_id).maybeSingle()) : null; renderPortal(); }
  } catch(e) { root.innerHTML = html`<div class="auth"><div class="card"><h2>Erro ao carregar</h2><p>${errMsg(e)}</p><button class="btn" id="out">Sair</button></div></div>`.s; $('#out').onclick = () => sb.auth.signOut(); }
}

async function loadLookups(){
  const [cat, cc, ct, fo, pr, rg] = await Promise.all([
    q(sb.from('categorias').select('*').order('nome')),
    q(sb.from('centros_custo').select('*').order('nome')),
    q(sb.from('contas_bancarias').select('*').order('nome')),
    q(sb.from('fornecedores').select('*').order('nome')),
    q(sb.from('projetos').select('*').order('nome')),
    q(sb.from('regras_classificacao').select('*').order('padrao')),
  ]);
  Object.assign(S.lk, { categorias:cat, centros:cc, contas:ct, fornecedores:fo, projetos:pr, regras:rg });
}
const opts = (list, filter=()=>true) => list.filter(filter).map(x => ({ value:x.id, label:x.nome + (x.ativo === false ? ' (inativo)' : '') }));

// ----------------------------------------------------------------------------
// login / criar acesso / recuperar senha
// ----------------------------------------------------------------------------
function renderAuth(modo){
  const titulos = { entrar:'Entrar', criar:'Criar acesso', esqueci:'Recuperar senha', 'nova-senha':'Definir nova senha' };
  root.innerHTML = html`<div class="auth"><div class="card">
    <div class="small muted" style="letter-spacing:.06em;text-transform:uppercase">Financeiro</div>
    <h1>${titulos[modo]}</h1>
    ${modo === 'criar' ? html`<p class="muted small">Prestador PJ: use o mesmo e-mail que você passou para o financeiro — é ele que libera o envio das suas notas.</p>` : ''}
    <form id="af">
      ${modo === 'criar' ? html`<input name="nome" placeholder="Seu nome" required autocomplete="name">` : ''}
      ${modo !== 'nova-senha' ? html`<input name="email" type="email" placeholder="E-mail" required autocomplete="email">` : ''}
      ${modo !== 'esqueci' ? html`<input name="senha" type="password" placeholder="${modo === 'entrar' ? 'Senha' : 'Senha (mín. 8 caracteres)'}" required minlength="${modo === 'entrar' ? 1 : 8}" autocomplete="${modo === 'entrar' ? 'current-password' : 'new-password'}">` : ''}
      <button class="btn pri" type="submit">${titulos[modo]}</button>
    </form>
    <div class="row small" style="margin-top:14px;justify-content:space-between">
      ${modo === 'entrar' ? html`<button class="linkbtn" data-m="criar">Criar acesso</button><button class="linkbtn" data-m="esqueci">Esqueci a senha</button>` : html`<button class="linkbtn" data-m="entrar">Voltar para o login</button>`}
    </div></div></div>`.s;
  $$('[data-m]').forEach(b => b.onclick = () => renderAuth(b.dataset.m));
  $('#af').onsubmit = async e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); const btn = $('button[type=submit]', e.target); btn.disabled = true;
    try {
      if (modo === 'entrar') { const { data, error } = await sb.auth.signInWithPassword({ email:f.email, password:f.senha }); if (error) throw error; await afterLogin(data.session); }
      if (modo === 'criar') {
        const { data, error } = await sb.auth.signUp({ email:f.email, password:f.senha, options:{ data:{ nome:f.nome }, emailRedirectTo: location.origin + location.pathname } });
        if (error) throw error;
        if (data.session) await afterLogin(data.session);
        else { toast('Enviamos um link de confirmação para o seu e-mail.'); renderAuth('entrar'); }
      }
      if (modo === 'esqueci') { const { error } = await sb.auth.resetPasswordForEmail(f.email, { redirectTo: location.origin + location.pathname }); if (error) throw error; toast('Se o e-mail existir, você vai receber um link para redefinir a senha.'); renderAuth('entrar'); }
      if (modo === 'nova-senha') { const { data, error } = await sb.auth.updateUser({ password:f.senha }); if (error) throw error; history.replaceState(null,'',location.pathname); toast('Senha atualizada.'); const s = await sb.auth.getSession(); await afterLogin(s.data.session); }
    } catch(err) { toast(errMsg(err), true); btn.disabled = false; }
  };
}

// ----------------------------------------------------------------------------
// modal de formulário genérico
// field: {key,label,type,options,required,full,hint,onChange,min,accept}
// ----------------------------------------------------------------------------
function formModal({ title, fields, initial={}, saveLabel='Salvar', onSave, note }){
  return new Promise(resolve => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    const fieldHtml = f => {
      const v = initial[f.key];
      const req = f.required ? raw(' required') : '';
      const id = 'f_' + f.key;
      let input;
      switch (f.type) {
        case 'select': input = html`<select id="${id}" name="${f.key}"${req}><option value="">${f.placeholder || '—'}</option>${(typeof f.options === 'function' ? f.options(initial) : f.options).map(o => html`<option value="${o.value}"${String(o.value) === String(v ?? '') ? raw(' selected') : ''}>${o.label}</option>`)}</select>`; break;
        case 'textarea': input = html`<textarea id="${id}" name="${f.key}"${req}>${v ?? ''}</textarea>`; break;
        case 'bool': input = html`<input id="${id}" type="checkbox" name="${f.key}"${v ? raw(' checked') : ''}>`; break;
        case 'money': input = html`<input id="${id}" name="${f.key}" inputmode="decimal" placeholder="0,00" value="${moneyInput(v)}"${req}>`; break;
        case 'month': input = html`<input id="${id}" type="month" name="${f.key}" value="${v ? String(v).slice(0,7) : ''}"${req}>`; break;
        case 'tags': input = html`<input id="${id}" name="${f.key}" value="${(v || []).join(', ')}" placeholder="PE - Master Fluxo, VE - 1/26">`; break;
        case 'file': input = html`<input id="${id}" type="file" name="${f.key}" accept="${f.accept || ''}"${req}>`; break;
        default: input = html`<input id="${id}" type="${f.type || 'text'}" name="${f.key}" value="${v ?? ''}"${f.min != null ? raw(` min="${f.min}"`) : ''}${f.max != null ? raw(` max="${f.max}"`) : ''}${req}>`;
      }
      return html`<div class="f${f.full || f.type === 'textarea' ? raw(' full') : ''}${f.type === 'bool' ? raw(' chk') : ''}">${f.type === 'bool' ? html`${input}<label for="${id}">${f.label}</label>` : html`<label for="${id}">${f.label}${f.required ? ' *' : ''}</label>${input}`}${f.hint ? html`<span class="hint">${f.hint}</span>` : ''}</div>`;
    };
    bg.innerHTML = html`<form class="modal" novalidate><header><h2>${title}</h2><button type="button" class="btn sm" data-x>Fechar</button></header>
      <div class="body">${note ? html`<div class="f full note info">${note}</div>` : ''}${fields.map(fieldHtml)}</div>
      <footer><button type="button" class="btn" data-x>Cancelar</button><button class="btn pri" type="submit">${saveLabel}</button></footer></form>`.s;
    document.body.appendChild(bg);
    const form = $('form', bg);
    const close = r => { bg.remove(); resolve(r); };
    $$('[data-x]', bg).forEach(b => b.onclick = () => close(null));
    bg.addEventListener('mousedown', e => { if (e.target === bg) close(null); });
    const read = () => {
      const out = {};
      for (const f of fields) {
        const elx = form.elements[f.key]; if (!elx) continue;
        let v = elx.value;
        if (f.type === 'bool') v = elx.checked;
        else if (f.type === 'money') v = parseMoney(v);
        else if (f.type === 'number') v = v === '' ? null : Number(v);
        else if (f.type === 'month') v = v ? v + '-01' : null;
        else if (f.type === 'tags') v = v.split(',').map(s => s.trim()).filter(Boolean);
        else if (f.type === 'file') v = elx.files[0] || null;
        else v = v === '' ? null : v;
        out[f.key] = v;
      }
      return out;
    };
    fields.filter(f => f.onChange).forEach(f => form.elements[f.key].addEventListener('change', () => f.onChange(read(), form)));
    form.onsubmit = async e => {
      e.preventDefault();
      const data = read();
      for (const f of fields) {
        const v = data[f.key];
        if (f.required && (v == null || v === '' || (Array.isArray(v) && !v.length))) return toast(`Preencha: ${f.label}`, true);
        if (f.type === 'money' && Number.isNaN(v)) return toast(`Valor inválido em: ${f.label}`, true);
      }
      const btn = $('button[type=submit]', form); btn.disabled = true;
      try { const r = onSave ? await onSave(data) : data; close(r ?? true); }
      catch(err) { toast(errMsg(err), true); btn.disabled = false; }
    };
    setTimeout(() => form.querySelector('input:not([type=checkbox]),select,textarea')?.focus(), 30);
  });
}

async function portalLista(){

  const rows = await q(sb.from('notas_fiscais').select('*').order('competencia', { ascending:false }).order('created_at', { ascending:false }));
  if (!rows.length) { box.innerHTML = html`<div class="empty">Você ainda não enviou nenhuma nota. Use o botão “Enviar nota fiscal”.</div>`.s; return; }
  box.innerHTML = html`${rows.map(n => html`<div class="nf-item">

        ${n.status === 'enviada' ? html`<button class="btn sm danger" data-del="${n.id}">Excluir</button>` : ''}
      </div></div>`)}`.s;
  $$('[data-ver]', box).forEach(b => b.onclick = () => abrirArquivo(rows.find(r => r.id === b.dataset.ver).arquivo_path));
  $$('[data-edit]', box).forEach(b => b.onclick = () => nfForm(rows.find(r => r.id === b.dataset.edit)));
  $$('[data-del]', box).forEach(b => b.onclick = async () => {

function statusTexto(n){
  if (n.status === 'enviada') return 'Recebida, aguardando conferência do financeiro';
  if (n.status === 'aprovada') return n.data_prevista_pagamento ? `Aprovada · pagamento previsto para ${brDate(n.data_prevista_pagamento)}` : 'Aprovada';
  if (n.status === 'paga') return `Paga em ${brDate(n.data_pagamento)}`;
  if (n.status === 'rejeitada') return 'Precisa de correção';
  return '';
}

async function abrirArquivo(path, bucket='notas-fiscais'){
  const w = window.open('', '_blank');
  const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, 300);
  if (error) { w?.close(); return toast(errMsg(error), true); }
  if (w) w.location = data.signedUrl; else location.href = data.signedUrl;
}

const ACEITOS = '.pdf,.xml,.png,.jpg,.jpeg,application/pdf,text/xml,application/xml,image/png,image/jpeg';
async function uploadNF(fornecedorId, competencia, file){
  if (file.size > 10 * 1024 * 1024) throw new Error('Arquivo maior que 10 MB.');
  const nomeLimpo = file.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\-]+/g,'_').slice(-80);
  const path = `${fornecedorId}/${competencia.slice(0,7)}/${Date.now()}-${nomeLimpo}`;
  const { error } = await sb.storage.from('notas-fiscais').upload(path, file, { contentType: file.type || undefined });
  if (error) throw error;
  return { path, nome: file.name };
}

// Formulário de NF — usado pelo PJ no portal e pelo financeiro ("registrar NF recebida por e-mail")
async function nfForm(nf=null, { fornecedorId=null, depois=portalLista } = {}){
  const doFinanceiro = !!fornecedorId || (isFin() && nf);
  const forn = fornecedorId ? S.lk.fornecedores.find(f => f.id === fornecedorId) : S.fornecedor;
  // até o dia 15, o mais comum é estar enviando a nota do mês anterior
  const compPadrao = firstDay(new Date().getDate() <= 15 ? addMonths(monthKey(), -1) : monthKey());
  const initial = nf ? { ...nf } : { competencia: compPadrao, valor: forn?.valor_mensal, data_emissao: today() };
  const fields = [
    { key:'competencia', label:'Mês do serviço', type:'month', required:true, hint:'Mês em que o serviço foi prestado' },
    { key:'numero', label:'Número da NF', required:true },
    { key:'data_emissao', label:'Data de emissão', type:'date', required:true },
    { key:'valor', label:'Valor da nota (R$)', type:'money', required:true, hint: forn?.valor_mensal ? `Valor combinado: ${money(forn.valor_mensal)}` : '' },
    { key:'descricao_servico', label:'Descrição do serviço', type:'textarea' },
    { key:'arquivo', label: nf ? 'Substituir arquivo (opcional)' : 'Arquivo da nota (PDF ou XML)', type:'file', accept:ACEITOS, required:!nf, full:true, hint:'Até 10 MB' },
  ];
  const note = nf?.status === 'rejeitada' ? `Motivo da devolução: ${nf.motivo_rejeicao}` : (doFinanceiro ? `Registrando nota de ${forn?.nome}` : null);
  const ok = await formModal({ title: nf ? `NF ${nf.numero}` : 'Enviar nota fiscal', fields, initial, note, saveLabel: nf?.status === 'rejeitada' ? 'Reenviar' : 'Enviar', onSave: async d => {
    if (d.valor <= 0) throw new Error('O valor precisa ser maior que zero.');
    const fid = nf?.fornecedor_id || forn.id;
    let arq = null;
    if (d.arquivo) arq = await uploadNF(fid, d.competencia, d.arquivo);
    const row = { competencia:d.competencia, numero:d.numero.trim(), data_emissao:d.data_emissao, valor:d.valor, descricao_servico:d.descricao_servico };
    if (arq) Object.assign(row, { arquivo_path:arq.path, arquivo_nome:arq.nome });
    try {
      if (nf) await q(sb.from('notas_fiscais').update(row).eq('id', nf.id));
      else await q(sb.from('notas_fiscais').insert({ ...row, fornecedor_id: fid }));
    } catch(e) { if (arq) await sb.storage.from('notas-fiscais').remove([arq.path]); throw e; }
    if (arq && nf?.arquivo_path) await sb.storage.from('notas-fiscais').remove([nf.arquivo_path]);
    return true;
  }});
  if (ok) { toast(nf ? 'Nota atualizada.' : 'Nota enviada! O financeiro vai conferir.'); depois(); }
}

async function gerarRecorrencias(mes){

function chartFluxo(rows, atual){
  const meses = []; for (let i = -5; i <= 3; i++) meses.push(addMonths(atual, i));
  const data = meses.map(m => { const r = rows.find(x => x.mes === firstDay(m)) || {}; return { m, er:+r.receitas_realizadas||0, sr:+r.despesas_realizadas||0, ep:+r.receitas_previstas||0, sp:+r.despesas_previstas||0 }; });
  const max = Math.max(1, ...data.map(d => Math.max(d.er+d.ep, d.sr+d.sp)));
  const W = 640, H = 240, pl = 58, pb = 28, pt = 10, cw = (W - pl) / data.length, bw = Math.min(22, cw/3);
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  const fmtK = v => v >= 1e6 ? (v/1e6).toFixed(1).replace('.',',') + ' mi' : v >= 1e3 ? Math.round(v/1e3) + ' mil' : Math.round(v);
  const ticks = [0, .25, .5, .75, 1].map(t => max * t);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Fluxo de caixa mensal">`;
  ticks.forEach(t => { s += `<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--ink-3)">${fmtK(t)}</text>`; });
  data.forEach((d, i) => {
    const cx = pl + cw * i + cw/2;
    const bar = (x, real, prev, cor) => {
      let o = ''; const y0 = y(0), yr = y(real), yp = y(real + prev);
      if (real) o += `<rect x="${x}" y="${yr}" width="${bw}" height="${y0-yr}" rx="2" fill="${cor}"><title>${esc(brMonth(firstDay(d.m)))}: ${esc(money(real))} realizado</title></rect>`;
      if (prev) o += `<rect x="${x}" y="${yp}" width="${bw}" height="${yr-yp}" rx="2" fill="${cor}" opacity=".35"><title>${esc(brMonth(firstDay(d.m)))}: ${esc(money(prev))} previsto</title></rect>`;
      return o;
    };
    s += bar(cx - bw - 1, d.er, d.ep, 'var(--pos)') + bar(cx + 1, d.sr, d.sp, 'var(--neg)');
    s += `<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="${d.m === atual ? 'var(--ink)' : 'var(--ink-3)'}" font-weight="${d.m === atual ? 600 : 400}">${brMonth(firstDay(d.m))}</text>`;
  });
  return raw(s + '</svg>');
}

const PAGE = 50;
function lancFields(tipo){
  const catFilter = c => tipo === 'pagar' ? c.tipo !== 'receita' : c.tipo !== 'despesa';
  return [
    { key:'descricao', label:'Descrição', required:true, full:true },
    { key:'fornecedor_id', label: tipo === 'pagar' ? 'Fornecedor / pessoa' : 'Cliente', type:'select', options:() => opts(S.lk.fornecedores),
      onChange:(d, form) => { const f = S.lk.fornecedores.find(x => x.id === d.fornecedor_id); if (!f) return;
        if (!form.elements.categoria_id.value && f.categoria_padrao_id) form.elements.categoria_id.value = f.categoria_padrao_id;
        if (!form.elements.centro_custo_id.value && f.centro_custo_padrao_id) form.elements.centro_custo_id.value = f.centro_custo_padrao_id;
        if (!form.elements.conta_id.value && f.conta_padrao_id) form.elements.conta_id.value = f.conta_padrao_id;
        if (!form.elements.valor.value && (f.valor_mensal || f.salario_bruto)) form.elements.valor.value = moneyInput(f.valor_mensal || f.salario_bruto); } },
    { key:'valor', label:'Valor (R$)', type:'money', required:true },
    { key:'categoria_id', label:'Categoria', type:'select', required:true, options:() => opts(S.lk.categorias, catFilter) },
    { key:'centro_custo_id', label:'Centro de custo/lucro', type:'select', options:() => opts(S.lk.centros) },
    { key:'conta_id', label:'Conta ou cartão', type:'select', options:() => S.lk.contas.filter(c => c.ativo !== false).map(c => ({ value:c.id, label: c.nome + (c.tipo === 'cartao' ? ' (cartão)' : '') })), hint:'Escolhendo um cartão, a compra entra na fatura certa sozinha' },
    { key:'data_competencia', label:'Competência', type:'month', required:true, hint:'Mês a que pertence (DRE)' },
    { key:'data_documento', label:'Data da compra / emissão', type:'date' },
    { key:'data_vencimento', label:'Vencimento', type:'date', required:true },
    { key:'status', label:'Status', type:'select', required:true, options:[{value:'previsto',label:'Previsto'},{value:'aprovado',label:'Aprovado'},{value:'pago',label: tipo === 'pagar' ? 'Pago' : 'Recebido'},{value:'cancelado',label:'Cancelado'}] },
    { key:'data_pagamento', label: tipo === 'pagar' ? 'Data do pagamento' : 'Data do recebimento', type:'date', hint:'Obrigatória se status = pago' },
    { key:'forma_pagamento', label:'Forma', type:'select', options:[['pix','PIX'],['boleto','Boleto'],['transferencia','Transferência'],['cartao_credito','Cartão de crédito'],['debito_automatico','Débito automático'],['dinheiro','Dinheiro'],['outro','Outro']].map(([value,label]) => ({value,label})) },
    { key:'custo_nivel', label:'Nível de custo', type:'select', options:[{value:'fixo',label:'Fixo'},{value:'variavel',label:'Variável'}] },
    { key:'projeto_id', label:'Projeto / evento', type:'select', options:() => opts(S.lk.projetos) },
    { key:'tags', label:'Tags', type:'tags' },
    { key:'codigo_barras', label:'Código de barras / linha digitável do boleto', full:true },
    { key:'observacoes', label:'Observações', type:'textarea' },
  ];
}
const LANC_COLS = ['descricao','fornecedor_id','valor','categoria_id','centro_custo_id','conta_id','data_competencia','data_vencimento','data_documento','status','data_pagamento','forma_pagamento','custo_nivel','projeto_id','tags','codigo_barras','observacoes'];
function limpaLanc(d, tipo){
  const o = { tipo }; LANC_COLS.forEach(k => o[k] = d[k] ?? (k === 'tags' ? [] : null));
  if (o.status === 'pago' && !o.data_pagamento) o.data_pagamento = o.data_vencimento <= today() ? o.data_vencimento : today();
  if (o.status !== 'pago') o.data_pagamento = null;
  return o;
}
async function editarLanc(tipo, row=null, dup=false, depois=route){
  const initial = row ? { ...row } : { status:'previsto', data_competencia: firstDay(monthKey()), data_vencimento: today(), tags:[] };
  if (dup) { initial.status = 'previsto'; initial.data_pagamento = null; }
  const ok = await formModal({ title: row && !dup ? 'Editar lançamento' : (tipo === 'pagar' ? 'Nova conta a pagar' : 'Nova conta a receber'), fields: lancFields(tipo), initial,
    note: row?.conciliado && !dup ? 'Este lançamento está conciliado com o extrato. Para mudar valor ou data, desfaça a conciliação em Conciliação bancária.' : row?.fatura_id && row?.id && !dup ? 'Compra de cartão: vencimento e status vêm da fatura.' : row?.nota_fiscal_id ? 'Este lançamento está ligado a uma nota fiscal. Ao marcar como pago, o PJ vê a nota como paga no portal.' : null,
    onSave: async d => { const o = limpaLanc(d, tipo); if (row && !dup) await q(sb.from('lancamentos').update(o).eq('id', row.id)); else await q(sb.from('lancamentos').insert(o)); } });
  if (ok) { toast('Salvo.'); depois(); }
}

async function marcarPago(list, tipo){

  const semNF = list.filter(l => l.aguardando_nf);

    fields:[{ key:'data', label:'Data', type:'date', required:true }], initial:{ data: today() },
    onSave: async d => { await q(sb.from('lancamentos').update({ status:'pago', data_pagamento:d.data }).in('id', list.map(x => x.id))); } });
  if (ok) { toast('Pronto.'); route(); }
}

      const r = await formModal({ title:'Registrar NF', fields:[{ key:'f', label:'Prestador', type:'select', required:true, options:() => opts(S.lk.fornecedores, f => f.ativo && ['pj','fornecedor'].includes(f.tipo)) }], saveLabel:'Continuar' });

    });

    $$('[data-apr]').forEach(b => b.onclick = async () => { const n = byId(b.dataset.apr); const esp = n.fornecedores?.valor_mensal;
      const ok = await formModal({ title:`Aprovar NF ${n.numero} · ${n.fornecedores?.nome}`,
        note: `${money(n.valor)} referente a ${brMonth(n.competencia)}.${esp && Math.abs(n.valor - esp) >= .01 ? ` Atenção: o valor combinado é ${money(esp)}.` : ''} Se já existir a previsão desse PJ no mês (recorrência), ela é confirmada com o valor da nota; se não, uma conta a pagar nova é criada.`,
        fields:[{ key:'venc', label:'Data de pagamento (opcional)', type:'date', hint:'Em branco = dia de pagamento do cadastro, no mês seguinte à competência' }], saveLabel:'Aprovar',
        onSave: async d => q(sb.rpc('aprovar_nota_fiscal', { p_nf:n.id, p_vencimento:d.venc || null })) });
      if (ok) { toast('Nota aprovada e conta a pagar criada/confirmada.'); render(); } });
    $$('[data-rej]').forEach(b => b.onclick = async () => { const n = byId(b.dataset.rej);
      const ok = await formModal({ title:`Devolver NF ${n.numero}`, note:'O prestador vê este motivo no portal e pode corrigir e reenviar.',
        fields:[{ key:'motivo', label:'Motivo', type:'textarea', required:true }], saveLabel:'Devolver',
        onSave: async d => q(sb.rpc('rejeitar_nota_fiscal', { p_nf:n.id, p_motivo:d.motivo })) });
      if (ok) { toast('Nota devolvida ao prestador.'); render(); } });
    $$('[data-undo]').forEach(b => b.onclick = async () => { const n = byId(b.dataset.undo);
      if (!await confirmar('Desfazer aprovação', `A NF ${n.numero} volta para “para conferir”. A conta a pagar volta a ser previsão (se veio de recorrência) ou é cancelada.`)) return;
      try { await q(sb.rpc('desfazer_aprovacao_nf', { p_nf:n.id })); toast('Aprovação desfeita.'); render(); } catch(e) { toast(errMsg(e), true); } });
    $('#fcomp')?.addEventListener('change', e => { st.comp = e.target.value + '-01'; render(); });
    $$('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); toast('Mensagem copiada.'); } catch { toast('Não consegui copiar. Selecione e copie manualmente.', true); } });
  };
  await render();
}

async function notasFaltando(st){
  const [forn, nfs, perfis] = await Promise.all([
    q(sb.from('fornecedores').select('id,nome,email,valor_mensal').eq('ativo', true).eq('exige_nf', true).order('nome')),
    q(sb.from('notas_fiscais').select('fornecedor_id').eq('competencia', st.comp)),
    q(sb.from('perfis').select('fornecedor_id').not('fornecedor_id','is',null)),
  ]);
  const enviou = new Set(nfs.map(n => n.fornecedor_id)), temLogin = new Set(perfis.map(p => p.fornecedor_id));
  const falta = forn.filter(f => !enviou.has(f.id));
  const link = location.origin + location.pathname;
  const msg = f => `Oi, ${f.nome.split(' ')[0]}! Ainda não recebemos sua NF de ${brMonth(st.comp)}. Envie pelo portal: ${link} (prazo: dia ${S.params?.dia_limite_envio_nf || 25}).`;
  return html`<div class="filters"><label class="small muted">Competência</label><input type="month" id="fcomp" value="${st.comp.slice(0,7)}"><span class="small muted grow">${falta.length} de ${forn.length} prestadores com “exige NF” ainda não enviaram.</span></div>
    ${falta.length ? html`<div class="tbl-wrap"><table><thead><tr><th>Prestador</th><th>Acesso ao portal</th><th class="r">Valor combinado</th><th></th></tr></thead><tbody>
      ${falta.map(f => html`<tr><td>${f.nome}</td>
        <td class="small">${!f.email ? html`<span class="neg">sem e-mail no cadastro</span> — não consegue acessar` : temLogin.has(f.id) ? html`<span class="ok">ativo</span> · ${f.email}` : html`<span class="muted">e-mail cadastrado, ainda não criou login</span> · ${f.email}`}</td>
        <td class="r num">${money(f.valor_mensal)}</td><td class="r"><button class="btn sm" data-copy="${msg(f)}">Copiar lembrete</button></td></tr>`)}
    </tbody></table></div>` : html`<div class="empty">Todo mundo enviou. 👏</div>`}`;
}

async function viewRelatorios(){
  const st = store.get('fin_filtro_dre') || { de: addMonths(monthKey(), -5), ate: monthKey(), por:'categoria', prev:false };
  const render = async () => {
    store.set('fin_filtro_dre', st);
    const rows = await q(sb.from('vw_resultado_categoria').select('*').gte('mes', firstDay(st.de)).lte('mes', firstDay(st.ate)).limit(20000));
    const meses = []; for (let m = st.de; m <= st.ate && meses.length < 24; m = addMonths(m, 1)) meses.push(firstDay(m));
    const v = r => Number(r.realizado || 0) + (st.prev ? Number(r.previsto || 0) : 0);
    const chave = r => st.por === 'categoria' ? r.categoria : r.centro_custo;
    const grupoDe = r => st.por === 'categoria' ? r.grupo : (r.tipo === 'receber' ? 'Receitas' : 'Despesas');
    const bloco = tipo => {
      const rs = rows.filter(r => r.tipo === tipo);
      const grupos = {};
      rs.forEach(r => { const g = grupoDe(r), k = chave(r); grupos[g] ??= {}; grupos[g][k] ??= {}; grupos[g][k][r.mes] = (grupos[g][k][r.mes] || 0) + v(r); });
      const totMes = m => rs.filter(r => r.mes === m).reduce((a,r) => a + v(r), 0);
      return { grupos, totMes };
    };
    const rec = bloco('receber'), desp = bloco('pagar');
    const linhaVals = obj => meses.map(m => html`<td class="r num small">${obj[m] ? money(obj[m]) : ''}</td>`);
    const total = obj => meses.reduce((a,m) => a + (obj[m] || 0), 0);
    const renderBloco = (b, nome, sinal) => html`<tr class="grp"><td>${nome}</td>${meses.map(m => html`<td class="r num">${money(b.totMes(m))}</td>`)}<td class="r num">${money(meses.reduce((a,m) => a + b.totMes(m), 0))}</td></tr>
      ${Object.entries(b.grupos).sort((a,b2) => a[0].localeCompare(b2[0])).map(([g, itens]) => html`
        ${st.por === 'categoria' ? html`<tr><td style="padding-left:16px;font-weight:500">${g}</td>${meses.map(m => html`<td class="r num small">${money(Object.values(itens).reduce((a,o) => a + (o[m] || 0), 0))}</td>`)}<td class="r num small">${money(Object.values(itens).reduce((a,o) => a + total(o), 0))}</td></tr>` : ''}
        ${Object.entries(itens).sort((a,b2) => total(b2[1]) - total(a[1])).map(([k, o]) => html`<tr><td class="small muted" style="padding-left:${st.por === 'categoria' ? 32 : 16}px">${k}</td>${linhaVals(o)}<td class="r num small">${money(total(o))}</td></tr>`)}`)}`;
    const res = m => rec.totMes(m) - desp.totMes(m);
    view().innerHTML = html`<div class="head"><div><h1>Relatórios</h1><p>DRE gerencial por competência. Transferências e aportes ficam fora.</p></div>
      <div class="row"><input type="month" id="rde" value="${st.de}"> até <input type="month" id="rate" value="${st.ate}">
        <select id="rpor"><option value="categoria"${st.por === 'categoria' ? raw(' selected') : ''}>Por categoria</option><option value="centro"${st.por === 'centro' ? raw(' selected') : ''}>Por centro de custo</option></select>
        <label class="row small"><input type="checkbox" id="rprev"${st.prev ? raw(' checked') : ''}> incluir previsto</label>
        <button class="btn" id="rcsv">Baixar CSV</button></div></div>
      <div class="card"><div class="tbl-wrap"><table class="dre"><thead><tr><th></th>${meses.map(m => html`<th class="r">${brMonth(m)}</th>`)}<th class="r">Total</th></tr></thead><tbody>
        ${renderBloco(rec, 'Receitas', 1)}${renderBloco(desp, 'Despesas', -1)}
        <tr class="tot"><td>Resultado</td>${meses.map(m => html`<td class="r num ${res(m) < 0 ? 'neg' : 'pos'}">${money(res(m))}</td>`)}<td class="r num">${money(meses.reduce((a,m) => a + res(m), 0))}</td></tr>
      </tbody></table></div></div>`.s;
    $('#rde').onchange = e => { st.de = e.target.value; render(); };
    $('#rate').onchange = e => { st.ate = e.target.value; render(); };
    $('#rpor').onchange = e => { st.por = e.target.value; render(); };
    $('#rprev').onchange = e => { st.prev = e.target.checked; render(); };
    $('#rcsv').onclick = () => {
      const linhas = [['Tipo','Grupo', st.por === 'categoria' ? 'Categoria' : 'Centro de custo', ...meses.map(brMonth), 'Total']];
      [['Receitas', rec], ['Despesas', desp]].forEach(([t, b]) => Object.entries(b.grupos).forEach(([g, itens]) => Object.entries(itens).forEach(([k, o]) => linhas.push([t, g, k, ...meses.map(m => (o[m] || 0).toFixed(2).replace('.',',')), total(o).toFixed(2).replace('.',',')]))));
      baixar(`dre-${st.de}-a-${st.ate}.csv`, linhas.map(l => l.map(csvCell).join(';')).join('\r\n'));
    };
  };
  await render();
}

// CSV no mesmo formato do export do Granatum: ; como separador, vírgula decimal,
// data dd/mm/aaaa, valor negativo para saída e codificação Windows-1252
// (é o que o Granatum/Excel em português esperam — UTF-8 vira "ProfissionÃ£o").
const CP1252 = {'€':0x80,'‚':0x82,'ƒ':0x83,'„':0x84,'…':0x85,'†':0x86,'‡':0x87,'ˆ':0x88,'‰':0x89,'Š':0x8A,'‹':0x8B,'Œ':0x8C,'Ž':0x8E,'‘':0x91,'’':0x92,'“':0x93,'”':0x94,'•':0x95,'–':0x96,'—':0x97,'˜':0x98,'™':0x99,'š':0x9A,'›':0x9B,'œ':0x9C,'ž':0x9E,'Ÿ':0x9F};
const toCp1252 = s => Uint8Array.from([...s], c => { const n = c.charCodeAt(0); return n < 128 || (n >= 160 && n < 256) ? n : (CP1252[c] ?? 63); });
const csvCell = v => { v = v == null ? '' : String(v); return /[;"\r\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
function baixar(nome, texto, cp=true){
  const blob = new Blob([cp ? toCp1252(texto) : texto], { type:'text/csv;charset=' + (cp ? 'windows-1252' : 'utf-8') });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

const XLSX_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const PDFJS_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function loadScript(src){
  if (document.querySelector(`script[src="${src}"]`)) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Não consegui carregar a biblioteca de leitura de arquivos. Verifique a internet e tente de novo.')); document.head.appendChild(s); });
}
async function lerPDF(file, ano){
  await loadScript(PDFJS_SRC);
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const linhas = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const tc = await (await pdf.getPage(p)).getTextContent();
    const porY = new Map();
    tc.items.forEach(it => { const y = Math.round(it.transform[5] / 2) * 2; if (!porY.has(y)) porY.set(y, []); porY.get(y).push(it); });
    [...porY.entries()].sort((a, b) => b[0] - a[0]).forEach(([, its]) => linhas.push(its.sort((a, b) => a.transform[4] - b.transform[4]).map(i => i.str).join(' ').replace(/\s+/g, ' ').trim()));
  }
  const NUM = String.raw`-?\s?(?:R\$\s?)?\d{1,3}(?:\.\d{3})*,\d{2}\s?-?(?:\s?[DC])?`;
  const re = new RegExp(String.raw`^(\d{1,2}[\/.]\d{1,2}(?:[\/.]\d{2,4})?|\d{1,2}\s?(?:de\s)?[A-Za-zç]{3})\s+(.+?)\s+(${NUM})(?:\s+(${NUM}))?$`, 'i');
  const out = [];
  for (const l of linhas) {
    const m = l.match(re); if (!m) continue;
    const data = parseData(m[1], ano); const desc = m[2].trim();
    if (!data || PULAR.test(semAcento(desc))) continue;
    const valor = parseNum(m[3]); if (!valor || isNaN(valor)) continue;
    out.push({ data, descricao: desc, documento: null, valor, saldo: m[4] ? parseNum(m[4]) : null });
  }
  return { linhas: out, avisos: ['PDF lido pelo texto da página. Confira valores e sinais na prévia antes de importar — CSV/Excel é mais confiável.'] };
}
async function lerArquivo(file, ano){
  const nome = file.name.toLowerCase();
  if (nome.endsWith('.pdf')) return lerPDF(file, ano);
  if (/\.(csv|txt)$/.test(nome)) {
    const buf = await file.arrayBuffer(); let text;
    try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch { text = new TextDecoder('windows-1252').decode(buf); }
    return tabelaParaExtrato(parseCSV(text.replace(/^﻿/, '')), ano);
  }
  await loadScript(XLSX_SRC);
  const wb = window.XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
  let melhor = { linhas: [], avisos: [] };
  for (const nomeAba of wb.SheetNames) {
    const r = tabelaParaExtrato(window.XLSX.utils.sheet_to_json(wb.Sheets[nomeAba], { header: 1, raw: true, defval: '' }), ano);
    if (r.linhas.length > melhor.linhas.length) melhor = r;
  }
  return melhor;
}
